---
title: Media
path: media
icon: mdi:music
type: sections
max_columns: 4
sections:
  - title: Playback
    cards:
      - type: custom:mass-player-card
        entities:
          - media_player.living_room_mass

      - type: custom:mushroom-template-card
        primary: >
          {% set g = state_attr('media_player.living_room_mass', 'group_members') or [] %}
          {% if 'media_player.living_room' in g %}HomePod linked{% else %}Link HomePod{% endif %}
        secondary: Group play
        icon: mdi:speaker-multiple
        icon_color: >
          {% set g = state_attr('media_player.living_room_mass', 'group_members') or [] %}
          {% if 'media_player.living_room' in g %}amber{% else %}disabled{% endif %}
        layout: horizontal
        fill_container: true
        tap_action:
          action: perform-action
          perform_action: script.music_toggle_homepod_group

  - title: Now Playing & Quick-Play
    column_span: 2
    cards:
      - type: custom:mushroom-media-player-card
        entity: media_player.living_room_tv
        layout: horizontal
        show_volume_level: true
        use_media_info: true
        volume_controls:
          - volume_set
        media_controls:
          - previous
          - play_pause_stop
          - next
        grid_options:
          columns: full

      - type: custom:mushroom-template-card
        primary: >
          {% set items = state_attr('sensor.mass_top_playlists', 'items') or [] %}
          {% if items | length > 0 %}{{ items[0].name }}{% else %}—{% endif %}
        secondary: Playlist
        icon: mdi:playlist-music
        icon_color: >
          {% set items = state_attr('sensor.mass_top_playlists', 'items') or [] %}
          {% if items | length > 0 %}green{% else %}disabled{% endif %}
        picture: >
          {% set items = state_attr('sensor.mass_top_playlists', 'items') or [] %}
          {% if items | length > 0 %}{{ items[0].image | default('') }}{% endif %}
        layout: horizontal
        fill_container: true
        grid_options:
          columns: full
        tap_action:
          action: perform-action
          perform_action: script.music_play_chip
          data:
            kind: playlist
            index: 0

      - type: custom:mushroom-template-card
        primary: >
          {% set items = state_attr('sensor.mass_top_playlists', 'items') or [] %}
          {% if items | length > 1 %}{{ items[1].name }}{% else %}—{% endif %}
        secondary: Playlist
        icon: mdi:playlist-music
        icon_color: >
          {% set items = state_attr('sensor.mass_top_playlists', 'items') or [] %}
          {% if items | length > 1 %}green{% else %}disabled{% endif %}
        picture: >
          {% set items = state_attr('sensor.mass_top_playlists', 'items') or [] %}
          {% if items | length > 1 %}{{ items[1].image | default('') }}{% endif %}
        layout: horizontal
        fill_container: true
        grid_options:
          columns: full
        tap_action:
          action: perform-action
          perform_action: script.music_play_chip
          data:
            kind: playlist
            index: 1

      - type: custom:mushroom-template-card
        primary: >
          {% set items = state_attr('sensor.mass_top_playlists', 'items') or [] %}
          {% if items | length > 2 %}{{ items[2].name }}{% else %}—{% endif %}
        secondary: Playlist
        icon: mdi:playlist-music
