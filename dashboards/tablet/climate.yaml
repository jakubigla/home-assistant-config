---
title: Climate
path: climate
icon: mdi:thermostat
type: sections
max_columns: 3
sections:
  - column_span: 3
    cards:
      # ===== Row 1: Primary hero — HEATING (winter) =====
      - type: horizontal-stack
        grid_options:
          columns: full
        visibility:
          - condition: state
            entity: binary_sensor.cooling_season
            state: "off"
        cards:
          - type: thermostat
            entity: climate.floor_heating
            name: Floor Heating
          - type: thermostat
            entity: climate.main_heating
            name: Wall Heaters

      # ===== Row 1b: Heating control (winter) =====
      # HA owns both circuits while heating_auto_control is on: the floor
      # follows sensor.floor_heating_target, the wall heaters are trimmed from
      # the bedroom (packages/areas/ground-floor/boiler-room). Dial changes are
      # overwritten within 10 min while it is on — switch it off to take over.
      - type: horizontal-stack
        grid_options:
          columns: full
        visibility:
          - condition: state
            entity: binary_sensor.cooling_season
            state: "off"
        cards:
          - type: custom:mushroom-entity-card
            entity: input_boolean.heating_auto_control
            name: Smart Heating
            icon: mdi:heat-pump
            icon_color: >-
              {% if is_state('input_boolean.heating_auto_control', 'on') %}orange
              {% else %}disabled{% endif %}
            layout: horizontal
            tap_action:
              action: toggle
          - type: custom:mushroom-template-card
            entity: sensor.floor_heating_target
            icon: mdi:thermometer-auto
            icon_color: >-
              {% if is_state('input_boolean.heating_auto_control', 'on') %}orange
              {% else %}disabled{% endif %}
            primary: >-
              {% set slots = {'night': 'Night', 'boost': 'Morning boost',
                              'day': 'Day', 'day_empty': 'Day · Sonia out',
                              'evening': 'Evening'} %}
              {% set sp = state_attr('climate.floor_heating', 'temperature') %}
              {% if is_state('input_boolean.heating_auto_control', 'on') %}
              Floor {{ sp | float(0) | round(1) }}° · {{ slots.get(state_attr('sensor.floor_heating_target', 'slot'), '–') }}
              {% else %}
              Floor {{ sp | float(0) | round(1) }}° · Bosch program
              {% endif %}
            secondary: >-
              Wall heaters {{ states('number.boiler_room_bosh_junkers_hc1_comfort_setpoint') | float(0) | round(1) }}°
              · bedroom {{ states('sensor.bedroom_temperature') | float(0) | round(1) }}°
              → {{ states('sensor.bedroom_heat_target') | float(0) | round(1) }}°
            layout: horizontal
            tap_action:
              action: more-info
              entity: sensor.floor_heating_target

      - type: horizontal-stack
        grid_options:
          columns: full
        visibility:
          - condition: state
            entity: binary_sensor.cooling_season
            state: "off"
        cards:
          - type: custom:mushroom-number-card
            entity: input_number.bedroom_heat_target_day
            name: Bedroom by day
            icon: mdi:weather-sunny
            display_mode: buttons
          - type: custom:mushroom-number-card
            entity: input_number.bedroom_heat_target_night
            name: Bedroom at night
            icon: mdi:weather-night
            display_mode: buttons

      # ===== Row 1: Primary hero — AC (summer) =====
      # Each AC is a vertical-stack: thermostat dial (live when the unit is online)
      # + an always-visible status chip that falls back to the room's hygrometer
      # temperature when the AC is unavailable, so a valid temperature ALWAYS shows.
      # One card switching content (not a visibility pair) per mushroom-visibility-gotcha.
      - type: horizontal-stack
        grid_options:
          columns: full
        visibility:
          - condition: state
            entity: binary_sensor.cooling_season
            state: "on"
        cards:
          - type: vertical-stack
            cards:
              - type: thermostat
                entity: climate.living_room
                name: Living Room AC
              - type: custom:mushroom-template-card
                entity: climate.living_room
                icon: mdi:air-conditioner
                icon_color: >-
                  {% if states('climate.living_room') in ['unavailable', 'unknown'] %}red
                  {% elif states('climate.living_room') == 'off' %}disabled
                  {% else %}blue{% endif %}
                primary: Living Room AC
                secondary: >-
                  {% set ac = states('climate.living_room') %}
                  {% if ac in ['unavailable', 'unknown'] %}
                    AC offline
                  {% else %}
                    {% set tgt = state_attr('climate.living_room', 'temperature') %}
                    {% set cur = state_attr('climate.living_room', 'current_temperature') | float(0) | round(1) %}
                    {{ cur }}°C{% if tgt %} → {{ tgt | float(0) | round(1) }}°C{% endif %} · {{ ac | capitalize }}
                  {% endif %}
                layout: horizontal
                tap_action:
                  action: more-info
          - type: vertical-stack
            cards:
              - type: thermostat
                entity: climate.bedroom
                name: Bedroom AC
              - type: custom:mushroom-template-card
                entity: climate.bedroom
                icon: mdi:air-conditioner
                icon_color: >-
                  {% if states('climate.bedroom') in ['unavailable', 'unknown'] %}red
                  {% elif states('climate.bedroom') == 'off' %}disabled
                  {% else %}blue{% endif %}
                primary: Bedroom AC
                secondary: >-
                  {% set ac = states('climate.bedroom') %}
                  {% if ac in ['unavailable', 'unknown'] %}
                    {{ states('sensor.bedroom_hygro_temperature') | float(0) | round(1) }}°C · AC offline
                  {% else %}
                    {% set tgt = state_attr('climate.bedroom', 'temperature') %}
                    {% set cur = state_attr('climate.bedroom', 'current_temperature') | float(0) | round(1) %}
                    {{ cur }}°C{% if tgt %} → {{ tgt | float(0) | round(1) }}°C{% endif %} · {{ ac | capitalize }}
                  {% endif %}
                layout: horizontal
                tap_action:
                  action: more-info

      # ===== Row 2: Secondary strip — AC chips (winter: AC is secondary) =====
      - type: horizontal-stack
        grid_options:
          columns: full
        visibility:
          - condition: state
            entity: binary_sensor.cooling_season
            state: "off"
        cards:
          - type: custom:mushroom-template-card
            entity: climate.living_room
            icon: mdi:air-conditioner
            icon_color: >-
              {% if states('climate.living_room') in ['unavailable', 'unknown'] %}red
              {% elif states('climate.living_room') == 'off' %}disabled
              {% else %}blue{% endif %}
            primary: Living Room AC
            secondary: >-
              {% if states('climate.living_room') in ['unavailable', 'unknown'] %}
                AC offline
              {% else %}
                {{ state_attr('climate.living_room', 'current_temperature') | float(0) | round(1) }}°C · {{ states('climate.living_room') | capitalize }}
              {% endif %}
            layout: horizontal
            tap_action:
              action: more-info
          - type: custom:mushroom-template-card
            entity: climate.bedroom
            icon: mdi:air-conditioner
            icon_color: >-
              {% if states('climate.bedroom') in ['unavailable', 'unknown'] %}red
              {% elif states('climate.bedroom') == 'off' %}disabled
              {% else %}blue{% endif %}
            primary: Bedroom AC
            secondary: >-
              {% if states('climate.bedroom') in ['unavailable', 'unknown'] %}
                {{ states('sensor.bedroom_hygro_temperature') | float(0) | round(1) }}°C · AC offline
              {% else %}
                {{ state_attr('climate.bedroom', 'current_temperature') | float(0) | round(1) }}°C · {{ states('climate.bedroom') | capitalize }}
              {% endif %}
            layout: horizontal
            tap_action:
              action: more-info

      # ===== Row 2: Secondary strip — heating chips (summer: heating is secondary) =====
      - type: horizontal-stack
        grid_options:
          columns: full
        visibility:
          - condition: state
            entity: binary_sensor.cooling_season
            state: "on"
        cards:
          - type: custom:mushroom-template-card
            entity: climate.floor_heating
            icon: mdi:radiator
            icon_color: >-
              {{ 'orange' if state_attr('climate.floor_heating', 'hvac_action') == 'heating' else 'disabled' }}
            primary: Floor Heating
            secondary: >-
              {{ state_attr('climate.floor_heating', 'current_temperature') | float(0) | round(1) }}°C · {{ state_attr('climate.floor_heating', 'hvac_action') | default('idle', true) | capitalize }}
            layout: horizontal
            tap_action:
              action: more-info
          - type: custom:mushroom-template-card
            entity: climate.main_heating
            icon: mdi:radiator
            icon_color: >-
              {{ 'orange' if state_attr('climate.main_heating', 'hvac_action') == 'heating' else 'disabled' }}
            primary: Wall Heaters
            secondary: >-
              {{ state_attr('climate.main_heating', 'current_temperature') | float(0) | round(1) }}°C · {{ state_attr('climate.main_heating', 'hvac_action') | default('idle', true) | capitalize }}
            layout: horizontal
            tap_action:
              action: more-info

      # ===== Row 3: Per-room environment =====
      - type: horizontal-stack
        grid_options:
          columns: full
        cards:
          - type: custom:mushroom-template-card
            entity: sensor.office_hygro_temperature
            icon: mdi:desk
            icon_color: >-
              {{ 'orange' if is_state('climate.office_ac', 'heat') else 'disabled' }}
            primary: >-
              {{ states('sensor.office_hygro_temperature') | float(0) | round(1) }}°C · {{ states('sensor.office_hygro_humidity') | float(0) | round(0) | int }}%
            secondary: Office
            layout: horizontal
            tap_action:
              action: more-info
              entity: climate.office_ac
          - type: custom:mushroom-template-card
            entity: sensor.bedroom_hygro_temperature
            icon: mdi:bed
            icon_color: >-
              {{ 'blue' if is_state('humidifier.bedroom', 'on') else 'disabled' }}
            primary: >-
              {{ states('sensor.bedroom_hygro_temperature') | float(0) | round(1) }}°C · {{ states('sensor.bedroom_hygro_humidity') | float(0) | round(0) | int }}%
            secondary: Bedroom
            layout: horizontal
            tap_action:
              action: more-info
              entity: humidifier.bedroom

      # ===== Row 4: 24 h trend sparklines =====
      - type: horizontal-stack
        grid_options:
          columns: full
        cards:
          - type: sensor
            entity: sensor.office_hygro_temperature
            graph: line
            hours_to_show: 24
            name: Office Temp
          - type: sensor
            entity: sensor.office_hygro_humidity
            graph: line
            hours_to_show: 24
            name: Office Humidity
          - type: sensor
            entity: sensor.bedroom_hygro_temperature
            graph: line
            hours_to_show: 24
            name: Bedroom Temp
          - type: sensor
            entity: sensor.bedroom_hygro_humidity
            graph: line
            hours_to_show: 24
            name: Bedroom Humidity
