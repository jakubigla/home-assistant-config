---
title: Outdoor
path: outdoor
icon: mdi:tree
type: sections
max_columns: 3
sections:
  # ── Weather hero (full width) ──────────────────────────────
  - type: grid
    column_span: 3
    cards:
      - type: weather-forecast
        grid_options:
          columns: full
        entity: weather.forecast_home
        show_current: true
        show_forecast: true
        forecast_type: hourly
        forecast_slots: 10

  # ── At a Glance: irrigation timings (full width) ───────────
  - type: grid
    column_span: 3
    cards:
      - type: custom:mushroom-chips-card
        alignment: justified
        grid_options:
          columns: full
        chips:
          - type: template
            icon: mdi:water
            icon_color: cyan
            content: >-
              {% set v = states('sensor.garden_drip_last_run') %}
              Drip: {% if v in ['unknown', 'unavailable', 'None', ''] %}
              never{% else %}{{ v | as_timestamp
                 | timestamp_custom('%a %H:%M') }}{% endif %}
          - type: template
            icon: mdi:sprout
            icon_color: light-green
            content: >-
              {% set v = states('sensor.garden_vertical_last_run') %}
              Vert: {% if v in ['unknown', 'unavailable', 'None', ''] %}
              never{% else %}{{ v | as_timestamp
                 | timestamp_custom('%a %H:%M') }}{% endif %}
          - type: template
            icon: mdi:sprinkler-variant
            icon_color: green
            content: >-
              {% set v = states('sensor.garden_lawn_last_run') %}
              Lawn: {% if v in ['unknown', 'unavailable', 'None', ''] %}
              never{% else %}{{ v | as_timestamp
                 | timestamp_custom('%a %H:%M') }}{% endif %}
          - type: template
            icon: mdi:clock-outline
            icon_color: green
            content: >-
              {% set v = states('sensor.garden_lawn_next_run') %}
              Next: {% if v in ['unknown', 'unavailable', 'None', ''] %}
              —{% else %}{{ v | as_timestamp
                 | timestamp_custom('%a %H:%M') }}{% endif %}
          - type: template
            icon: >-
              {% set tier = state_attr('sensor.garden_irrigation_profile', 'heat_tier') %}
              {% if tier == 'Scorcher' %}mdi:thermometer-alert
              {% elif tier == 'Hot' %}mdi:thermometer-high
              {% elif tier == 'Mild' %}mdi:thermometer-low
              {% else %}mdi:thermometer{% endif %}
            icon_color: >-
              {% set tier = state_attr('sensor.garden_irrigation_profile', 'heat_tier') %}
              {% if tier == 'Scorcher' %}red
              {% elif tier == 'Hot' %}orange
              {% elif tier == 'Mild' %}green
              {% else %}grey{% endif %}
            content: >-
              {% set mode = states('input_select.garden_irrigation_mode') %}
              {% set tier = state_attr('sensor.garden_irrigation_profile', 'heat_tier') %}
              {% if mode == 'Smart' and tier not in ['n/a', none, 'unknown', 'unavailable'] %}
              {{ tier }}{% else %}—{% endif %}

  # ── Soil moisture (monitoring) ─────────────────────────────
  # Probes are observational — they do NOT drive irrigation. Drip runs on
  # fixed days (see 7-Day Schedule) with rain as the veto and a 7-day
  # guarantee floor. Dry (<30%), waterlogged (>=85%) and silent-probe
  # (>2h) conditions are pushed as notifications by
  # garden_soil_moisture_alert / garden_soil_probe_silent_watchdog —
  # this section is the at-a-glance trend, not the alerting surface.
  - type: grid
    column_span: 3
    cards:
      - type: heading
        heading: Soil Moisture
        heading_style: title
        icon: mdi:water-percent

      # Live reading + 48h sparkline per bed
      - type: horizontal-stack
        grid_options:
          columns: full
        cards:
          - type: sensor
            entity: sensor.pergola_left_flowerbed_soil_moisture
            name: Pergola L
            icon: mdi:flower
            graph: line
            hours_to_show: 48
          - type: sensor
            entity: sensor.pergola_right_flowerbed_soil_moisture
            name: Pergola R
            icon: mdi:flower
            graph: line
            hours_to_show: 48
          - type: sensor
            entity: sensor.sona_flowerbed_soil_moisture
            name: Sona
            icon: mdi:flower-outline
            graph: line
            hours_to_show: 48
          - type: sensor
            entity: sensor.vertical_garden_soil_moisture
            name: Vertical
            icon: mdi:sprout
            graph: line
            hours_to_show: 48

  # ── 7-Day Schedule ─────────────────────────────────────────
  - type: grid
    cards:
      - type: heading
        heading: 7-Day Schedule
        heading_style: title
      - type: markdown
        entities:
          - input_select.garden_irrigation_mode
          - sensor.garden_irrigation_profile
        card_mod:
          style:
            ha-markdown$: |
              ha-markdown-element table {
                width: 100%;
                border-collapse: collapse;
              }
              ha-markdown-element th,
              ha-markdown-element td {
                padding: 4px 6px;
                text-align: left;
              }
              ha-markdown-element tr.today td {
                font-weight: 600;
              }
              ha-markdown-element td.note {
                color: var(--secondary-text-color);
              }
        content: |
          {% set mode = states('input_select.garden_irrigation_mode') %}
          {% set sched = state_attr('sensor.garden_schedule_brain', 'schedule_7day') or [] %}
          {% set tz = now().tzinfo %}
          {% macro dur(s) -%}
          {%- if s >= 3600 -%}{{ (s / 3600) | round(1) }}h
          {%- elif s >= 60 -%}{{ (s // 60) | int }}m
          {%- else -%}{{ s | int }}s{%- endif -%}
          {%- endmacro %}
          {% if mode == 'Manual' %}
          _Manual mode — no scheduled runs._
          {% else %}
          | Day | Lawn (per zone ×2) | Drip |
          |---|---|---|
          {% for row in sched -%}
          {%- set d = strptime(row.date, '%Y-%m-%d').replace(tzinfo=tz) -%}
          {%- set deep = (row.am_ratio | float(1.0)) > 1.0 -%}
          {%- if row.sessions == 2 -%}
            {%- set lawn_cell = '✓ AM ' ~ row.lawn_am_min ~ 'm + PM ' ~ row.lawn_pm_min ~ 'm' -%}
          {%- elif row.sessions == 1 -%}
            {%- set lawn_cell = ('🔥 ' if deep else '✓ ') ~ row.lawn_am_min ~ 'm' ~ (' deep' if deep else '') -%}
          {%- else -%}
            {%- set lawn_cell = '—' -%}
          {%- endif -%}
          {%- set drip_cell = ('✓ ' ~ dur(row.drip_min * 60)) if row.drip_min > 0 else '—' -%}
          | {% if loop.first %}**{{ d.strftime('%a %d') }}**{% else %}{{ d.strftime('%a %d') }}{% endif %} | {{ lawn_cell }} | {{ drip_cell }} |
          {% endfor %}

          {% if mode == 'Seasonal' %}
          _Seasonal: deep AM soak + ~60% PM top-up on 2-session days. AM {{ state_attr('sensor.garden_irrigation_profile', 'am_time') | trim }}{% if state_attr('sensor.garden_irrigation_profile', 'pm_time') | trim %} + PM {{ state_attr('sensor.garden_irrigation_profile', 'pm_time') | trim }}{% endif %}. Drip Mon/Thu._
          {% elif mode == 'Smart' %}
          _Smart: single early-morning (04:00) lawn run — no evening watering. On hot days (🔥) the AM run goes ~40% deeper instead of a separate evening top-up. Drip runs on the fixed days above; rain or wet soil can skip it, but a 7-day guarantee forces a run regardless._
          {% else %}
          _Single-pass lawn run; both zones water for the same minutes._
          {% endif %}
          {% set vnext = states('sensor.garden_vertical_next_run') %}
          _Vertical garden: {{ states('sensor.garden_vertical_planned_minutes')
          | int(states('input_number.garden_vertical_minutes') | int) }}m
          daily{% if is_state_attr('sensor.garden_vertical_planned_minutes', 'heat_boost', true) %} 🔥{% endif %},
          skips rain ({{ states('input_number.garden_vertical_days_between') | int }}d
          guarantee){% if vnext not in ['unknown', 'unavailable', 'none', ''] %} · next
          {{ vnext | as_timestamp | timestamp_custom('%a %H:%M') }}{% endif %}._
          {% endif %}

  # ── Irrigation Control: mode + one-off scheduler + Run Now ──
  - type: grid
    cards:
      - type: heading
        heading: Irrigation Control
        heading_style: title
      - type: custom:mushroom-select-card
        entity: input_select.garden_irrigation_mode
        name: Irrigation Mode
        icon: mdi:sprinkler
        layout: horizontal
      - type: heading
        heading: Schedule One-off
        heading_style: subtitle
      - type: custom:mushroom-select-card
        entity: input_select.garden_oneoff_type
        name: What
        icon: mdi:sprinkler-variant
        layout: horizontal
      - type: entities
        entities:
          - entity: input_datetime.garden_oneoff_at
            name: When
      - type: horizontal-stack
        cards:
          - type: custom:mushroom-template-card
            primary: >-
              {{ 'Armed' if is_state('input_boolean.garden_oneoff_armed', 'on')
                 else 'Schedule' }}
            secondary: >-
              {% if is_state('input_boolean.garden_oneoff_armed', 'on') %}
              {{ states('input_select.garden_oneoff_type') }} @
              {{ states('input_datetime.garden_oneoff_at')
                 | as_timestamp | timestamp_custom('%a %H:%M') }}
              {% else %}Tap to arm{% endif %}
            icon: mdi:timer-play
            icon_color: >-
              {{ 'orange' if is_state('input_boolean.garden_oneoff_armed', 'on')
                 else 'grey' }}
            layout: horizontal
            tap_action:
              action: perform-action
              perform_action: input_boolean.turn_on
              target:
                entity_id: input_boolean.garden_oneoff_armed
          - type: custom:mushroom-template-card
            primary: Cancel
            icon: mdi:timer-off
            icon_color: red
            layout: horizontal
            tap_action:
              action: perform-action
              perform_action: input_boolean.turn_off
              target:
                entity_id: input_boolean.garden_oneoff_armed
      - type: heading
        heading: Run Now
        heading_style: title
      - type: horizontal-stack
        cards:
          - type: custom:mushroom-template-card
            entity: script.garden_lawn_irrigation
            primary: Lawn
            icon: mdi:sprinkler-variant
            icon_color: green
            layout: vertical
            tap_action:
              action: perform-action
              perform_action: script.turn_on
              target:
                entity_id: script.garden_lawn_irrigation
          - type: custom:mushroom-template-card
            entity: script.garden_drip_irrigation
            primary: Drip
            icon: mdi:water
            icon_color: cyan
            layout: vertical
            tap_action:
              action: perform-action
              perform_action: script.turn_on
              target:
                entity_id: script.garden_drip_irrigation
          - type: custom:mushroom-template-card
            entity: script.garden_vertical_irrigation
            primary: Vertical
            icon: mdi:sprout
            icon_color: light-green
            layout: vertical
            tap_action:
              action: perform-action
              perform_action: script.turn_on
              target:
                entity_id: script.garden_vertical_irrigation
          - type: custom:mushroom-template-card
            entity: script.garden_full_irrigation
            primary: Full
            icon: mdi:sprinkler
            icon_color: teal
            layout: vertical
            tap_action:
              action: perform-action
              perform_action: script.turn_on
              target:
                entity_id: script.garden_full_irrigation
      - type: heading
        heading: Run Lawn Now
        heading_style: subtitle
      - type: custom:mushroom-number-card
        entity: input_number.garden_ondemand_minutes
        name: Minutes per zone
        display_mode: slider
        icon: mdi:timer-outline
      - type: custom:mushroom-template-card
        primary: >-
          {% if is_state('script.garden_ondemand_lawn', 'on') %}
          Running lawn…
          {% else %}Run Lawn{% endif %}
        secondary: >-
          {% if is_state('valve.lawn_sprinkler_zone_1', 'open') %}
          Zone 1 watering
          {% elif is_state('valve.lawn_sprinkler_zone_2', 'open') %}
          Zone 2 watering
          {% else %}
          Zones 1→2 · {{ states('input_number.garden_ondemand_minutes') | int }} min each
          {% endif %}
        icon: mdi:sprinkler
        icon_color: >-
          {{ 'blue' if is_state('script.garden_ondemand_lawn', 'on') else 'grey' }}
        layout: horizontal
        tap_action:
          action: perform-action
          perform_action: script.turn_on
          target:
            entity_id: script.garden_ondemand_lawn
      - type: heading
        heading: Vertical Garden
        heading_style: subtitle
      - type: custom:mushroom-number-card
        entity: input_number.garden_vertical_minutes
        name: Minutes per run
        display_mode: slider
        icon: mdi:timer-outline
      - type: custom:mushroom-number-card
        entity: input_number.garden_vertical_minutes_hot
        name: Minutes on hot day (≥31°C)
        display_mode: slider
        icon: mdi:timer-alert-outline
      - type: custom:mushroom-number-card
        entity: input_number.garden_vertical_days_between
        name: Rain guarantee (days)
        display_mode: slider
        icon: mdi:calendar-clock
      - type: entities
        entities:
          - entity: sensor.vertical_garden_soil_moisture
            name: Soil moisture
            icon: mdi:water-percent
          - entity: sensor.vertical_garden_temperature
            name: Soil temperature
            icon: mdi:thermometer
          - entity: sensor.garden_vertical_last_run
            name: Last run
            icon: mdi:history
          - entity: sensor.garden_vertical_next_run
            name: Next run
            icon: mdi:clock-outline

  # ── Drip detail ────────────────────────────────────────────
  # Drip runs on the fixed days from the schedule brain. Rain and wet soil
  # can veto a run; garden_drip_weekly_guarantee force-runs it anyway once
  # the last run is >= 6.95 days old.
  - type: grid
    cards:
      - type: heading
        heading: Drip
        heading_style: title
        icon: mdi:water
      - type: entities
        entities:
          - entity: sensor.garden_drip_last_run
            name: Last run
            icon: mdi:history
          - entity: sensor.garden_drip_next_run
            name: Next run
            icon: mdi:clock-outline
          - entity: binary_sensor.garden_drip_should_skip
            name: Skipping (rain/soil/season)
            icon: mdi:water-off
      - type: markdown
        content: >-
          {% set last = states('sensor.garden_drip_last_run') %}
          {% if last not in ['unknown', 'unavailable', 'none', ''] %}
          {% set days = (now() - (last | as_datetime)).total_seconds() / 86400 %}
          _Last drip {{ days | round(1) }} d ago. The 7-day guarantee force-runs
          the line at 6.95 d even on wet soil or rain._
          {% else %}
          _No drip run recorded yet._
          {% endif %}

      - type: custom:expander-card
        title: Probe detail
        icon: mdi:information-outline
        expanded: false
        cards:
          - type: entities
            entities:
              - type: section
                label: Pergola left
              - entity: sensor.pergola_left_flowerbed_temperature
                name: Soil temp
                icon: mdi:thermometer
              - entity: sensor.pergola_left_flowerbed_battery
                name: Battery
              - type: section
                label: Pergola right
              - entity: sensor.pergola_right_flowerbed_temperature
                name: Soil temp
                icon: mdi:thermometer
              - entity: sensor.pergola_right_flowerbed_battery
                name: Battery
              - type: section
                label: Sona
              - entity: sensor.sona_flowerbed_temperature
                name: Soil temp
                icon: mdi:thermometer
              - entity: sensor.sona_flowerbed_battery
                name: Battery
              - type: section
                label: Vertical garden
              - entity: sensor.vertical_garden_temperature
                name: Soil temp
                icon: mdi:thermometer
              - entity: sensor.vertical_garden_battery
                name: Battery
