---
template: !include_dir_list templates
automation: !include_dir_list automations
default_config: ~

# Silence integrations that flood the log when their devices are
# intentionally powered down (relay-cut smart bulbs) or cloud-flaky.
logger:
  logs:
    kasa.smart.smartdevice: critical
    kasa: critical
    pychromecast.socket_client: critical
    custom_components.dreame_vacuum.dreame.protocol: error
    urllib3.connectionpool: error

recorder:
  # 10 days (was 30, before that 5). Disk is not the limit (500 GB NVMe) —
  # RAM and backup size are: at 30 days the DB hit 1.45 GB, backups ~760 MB,
  # and the 1.9 GB Yellow was OOM-killing core/add-ons (Sep 2026). Long-term
  # statistics (energy, min/max/mean) are kept regardless of this setting.
  # The exclude list below is deliberately KEPT — the cost of recording is
  # writes and table size, and with ~2300 entities the chatty ones still
  # aren't worth storing.
  purge_keep_days: 10
  exclude:
    entity_globs:
      - sensor.browser_mod_*
      - binary_sensor.browser_mod_*
      - media_player.browser_mod_*
      - light.browser_mod_*
      - switch.ground_floor_*
      - switch.first_floor_*
      # UniFi device CPU/memory %. Unused anywhere; the gateway pair alone
      # wrote ~90k rows/day (cpu 42k + mem 48k, measured 2026-11-01).
      - sensor.*_cpu_utilization
      - sensor.*_memory_utilization
    entities:
      - switch.zigbee2mqtt_bridge_permit_join
      # Matter smart-plug electrical noise: ~7-8k rows/day EACH while the
      # plugs draw 0.0 W (measured 2026-11-01). _power and _energy are kept.
      - sensor.hall_1st_floor_socket_apparent_power
      - sensor.hall_1st_floor_socket_apparent_current
      - sensor.hall_1st_floor_socket_effective_current
      - sensor.hall_1st_floor_socket_power_factor
      - sensor.hall_1st_floor_socket_voltage
      - sensor.hall_1st_floor_socket_effective_voltage
      - sensor.attic_hall_attic_stairs_socket_apparent_power
      - sensor.attic_hall_attic_stairs_socket_apparent_current
      - sensor.attic_hall_attic_stairs_socket_effective_current
      - sensor.attic_hall_attic_stairs_socket_power_factor
      - sensor.attic_hall_attic_stairs_socket_voltage
      - sensor.attic_hall_attic_stairs_socket_effective_voltage

input_boolean:
  christmas_mode:
    name: Christmas Mode
    initial: false
    icon: mdi:pine-tree
