---
alias: Low battery alert
description: >-
  Daily 10:00 sweep over ALL battery sensors (device_class battery,
  entity_id ending in _battery) below 20%. Dynamic on purpose — a static
  entity list rots as devices come and go. Phones/watches/vacuums/EV are
  excluded by the _battery suffix rule (they end in _battery_level,
  _battery_2, _state_of_charge, ...).
id: 8f3b1c4e-2a7d-4e91-b6f0-d9c8a3e5f712

mode: single
max_exceeded: silent

trigger:
  - platform: time
    at: "10:00:00"

variables:
  excluded:
    # Reports 0% while the device works fine (voltage healthy).
    - sensor.laundry_room_sensor_battery
  low_batteries: >-
    {% set ns = namespace(out=[]) %}
    {% for s in states.sensor
       if s.entity_id.endswith('_battery')
       and s.attributes.device_class | default('') == 'battery'
       and s.entity_id not in excluded
       and s.state not in ['unavailable', 'unknown']
       and s.state | float(101) < 20 %}
      {% set ns.out = ns.out + [s.name ~ ' (' ~ s.state ~ '%)'] %}
    {% endfor %}
    {{ ns.out }}

condition:
  - condition: template
    value_template: "{{ low_batteries | count > 0 }}"

action:
  - action: persistent_notification.create
    data:
      title: "Low Battery"
      notification_id: low_battery_alert
      message: "{{ low_batteries | join(', ') }}"
