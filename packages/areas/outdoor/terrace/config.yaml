---
automation: !include_dir_list automations
template: !include_dir_list templates
light: !include_dir_list lights
script: !include_dir_named scripts

input_select:
  pergola_weather_mode:
    name: Pergola Weather Mode
    options:
      - Rainfall Sensor
      - Forecast
      - Both
      - Manual
    initial: Rainfall Sensor
    icon: mdi:weather-pouring

input_boolean:
  # Feature flag for the forecast-based rain gate (binary_sensor.
  # pergola_rain_expected). ON: morning open + restart close gate on the
  # forecast, and the forecast-rain+wet-plate close branch is armed. OFF:
  # legacy behavior — the rainfall plate (pergola_rain_active) gates
  # everything, so a residual-wet plate blocks the morning open again.
  # No `initial:` on purpose: restart re-applies initial and would wipe the
  # user's choice (see input_number-initial gotcha — applies to all helpers).
  pergola_forecast_gate:
    name: Pergola Forecast Gate
    icon: mdi:weather-partly-rainy

input_number:
  # Bridge fix for the Somfy limit drift. Commanding tilt 100 overshoots the
  # true-open point and bounces, so full OPEN = this max tilt (default 70)
  # and full CLOSE = tilt 0. script.pergola_roof_set maps a clean 0-100 %
  # open onto 0..max-tilt. Permanent fix is a Somfy installer
  # re-commissioning the Louver Control (see docs/pergola/). Remove this
  # helper + the commanded-position helper once that's done.
  pergola_roof_offset:
    name: Pergola Roof Max Tilt
    min: 40
    max: 100
    step: 1
    initial: 70
    unit_of_measurement: "%"
    mode: slider
    icon: mdi:arrow-expand-vertical

  # Last position HA commanded, in % open (0 = closed, 100 = open). The
  # motor's own position count has lost its reference: every close stalls
  # at the physical stop and Tahoma reports FAILED (WHILEEXEC_OTHER), so
  # cover.pergola_roof keeps a stale mid value (~53-55 tilt) while the roof
  # is shut. cover.pergola_roof_proxy reads THIS helper, not the motor.
  # Written by script.pergola_roof_set and by the external-move sync
  # automation. No `initial:` — restart must keep the restored value.
  pergola_roof_commanded_position:
    name: Pergola Roof Commanded Position
    min: 0
    max: 100
    step: 1
    unit_of_measurement: "%"
    mode: box
    icon: mdi:pergola
