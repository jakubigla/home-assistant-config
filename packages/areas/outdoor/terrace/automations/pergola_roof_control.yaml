---
alias: Pergola roof control
description: >
  Opens pergola roof in the morning if dry,
  closes at sunset or immediately when rain is detected.
  Morning open (and post-restart close) gate on
  binary_sensor.pergola_rain_expected (forecast: raining now or rain
  expected within ~3 h) — NOT on the rainfall plate, which stays wet for
  hours after rain stops and would block dry mornings on stale data.
  Instant rain-close still uses the plate via
  binary_sensor.pergola_rain_active (source per
  input_select.pergola_weather_mode).
  Drives cover.pergola_roof_proxy (calibrated) in clean 0-100 % position
  (100 = open, 0 = closed); all tilt-scaling lives in the proxy template.
  Morning target = 100 % open; sunset/rain = closed (0 % open).
id: a1f7c3e2-8d4b-4e9a-b6f1-2c8d5a9e7b30

mode: restart

trigger:
  - trigger: homeassistant
    event: start
    id: "ha_start"
  - trigger: event
    event_type: automation_reloaded
    id: "ha_start"
  - trigger: state
    entity_id: binary_sensor.sleeping_time
    from: "on"
    to: "off"
    id: "morning"
  - trigger: state
    entity_id: binary_sensor.dark_for_curtains
    from: "off"
    to: "on"
    id: "sunset"
  - trigger: state
    entity_id: binary_sensor.pergola_rain_active
    from: "off"
    to: "on"
    id: "rain_start"
  # Covers the plate-already-wet gap: if the roof opened in the morning on a
  # wrong dry forecast while residual wetness held pergola_rain_active on,
  # rain_start can never re-edge. The forecast flipping to rain is the only
  # remaining edge, so close on it when the plate agrees.
  - trigger: state
    entity_id: binary_sensor.raining
    from: "off"
    to: "on"
    id: "forecast_rain"

conditions: []

action:
  - choose:
      # HA restart / automation reload — close pergola if rain is falling or
      # expected. Gates on the forecast sensor, not the plate: reloads happen
      # on every config push, and a residual-wet plate would shut a roof the
      # morning branch deliberately opened.
      - alias: "HA start - close pergola if raining"
        conditions:
          - condition: trigger
            id: "ha_start"
          - condition: not
            conditions:
              - condition: state
                entity_id: input_select.pergola_weather_mode
                state: "Manual"
          - condition: state
            entity_id: binary_sensor.pergola_rain_expected
            state: "on"
          - condition: template
            value_template: >
              {{ state_attr('cover.pergola_roof_proxy',
                 'current_position') | int(0) != 0 }}
        sequence:
          - action: cover.close_cover
            target:
              entity_id: cover.pergola_roof_proxy

      # Open pergola in the morning — only if no rain falling or expected
      # (forecast, NOT the plate: residual wetness holds the plate on for
      # hours after rain stops), not Manual, and not a weekend (Sat/Sun stay
      # closed in the morning)
      - alias: "Morning - open pergola if dry"
        conditions:
          - condition: trigger
            id: "morning"
          - condition: not
            conditions:
              - condition: state
                entity_id: input_select.pergola_weather_mode
                state: "Manual"
          - condition: template
            value_template: "{{ now().weekday() < 5 }}"
          - condition: state
            entity_id: binary_sensor.pergola_rain_expected
            state: "off"
          - condition: template
            value_template: >
              {{ state_attr('cover.pergola_roof_proxy',
                 'current_position') | int(0) != 100 }}
        sequence:
          - action: cover.set_cover_position
            target:
              entity_id: cover.pergola_roof_proxy
            data:
              position: 100

      # Close pergola at sunset — not in Manual mode
      - alias: "Sunset - close pergola"
        conditions:
          - condition: trigger
            id: "sunset"
          - condition: not
            conditions:
              - condition: state
                entity_id: input_select.pergola_weather_mode
                state: "Manual"
          - condition: template
            value_template: >
              {{ state_attr('cover.pergola_roof_proxy',
                 'current_position') | int(0) != 0 }}
        sequence:
          - action: cover.close_cover
            target:
              entity_id: cover.pergola_roof_proxy

      # Close pergola immediately when rain starts
      - alias: "Rain detected - close pergola immediately"
        conditions:
          - condition: trigger
            id: "rain_start"
          - condition: not
            conditions:
              - condition: state
                entity_id: input_select.pergola_weather_mode
                state: "Manual"
          - condition: template
            value_template: >
              {{ state_attr('cover.pergola_roof_proxy',
                 'current_position') | int(0) != 0 }}
        sequence:
          - action: cover.close_cover
            target:
              entity_id: cover.pergola_roof_proxy

      # Forecast flips to rain while the plate is already wet — close. Only
      # fires when both sources agree; a dry plate means forecast alone never
      # closes the roof (respects the plate-first weather mode).
      - alias: "Forecast rain + wet plate - close pergola"
        conditions:
          - condition: trigger
            id: "forecast_rain"
          - condition: not
            conditions:
              - condition: state
                entity_id: input_select.pergola_weather_mode
                state: "Manual"
          - condition: state
            entity_id: binary_sensor.pergola_rain_active
            state: "on"
          - condition: template
            value_template: >
              {{ state_attr('cover.pergola_roof_proxy',
                 'current_position') | int(0) != 0 }}
        sequence:
          - action: cover.close_cover
            target:
              entity_id: cover.pergola_roof_proxy
