---
# HomeKit / dashboard face of the Somfy Pergola Roof. NOT for automations —
# they call script.pergola_roof_set directly.
#
# Position comes from input_number.pergola_roof_commanded_position (what HA
# last commanded, kept in sync with app/remote moves by
# pergola_roof_sync_external), NOT from the motor. The motor's position
# count has lost its reference: every close stalls at the physical stop,
# Tahoma marks it FAILED (WHILEEXEC_OTHER), and cover.pergola_roof (plus the
# Tahoma app) keeps reporting a stale ~53-55 tilt while the roof is shut.
#
# All moves go through script.pergola_roof_set, which maps clean 0-100 %
# open onto raw tilt 0..input_number.pergola_roof_offset (full open never
# commands raw tilt 100: overshoot + bounce).
#
# Revert once a Somfy installer re-commissions the Louver Control (see
# docs/pergola/): position back to the raw tilt, drop the commanded helper,
# the sync automation and the script.
cover:
  - name: Pergola Roof Proxy
    unique_id: pergola_roof_position_proxy
    device_class: awning
    availability: >
      {{ states('cover.pergola_roof') not in ['unavailable', 'unknown'] }}
    position: >
      {{ states('input_number.pergola_roof_commanded_position') | int(0) }}
    open_cover:
      - action: script.pergola_roof_set
        data:
          position: 100
    close_cover:
      - action: script.pergola_roof_set
        data:
          position: 0
    stop_cover:
      # Commanded position stays at the last target; the sync automation
      # skips moves within its HA-command window, so a stop mid-travel
      # leaves the proxy showing the target until the next move.
      - action: cover.stop_cover_tilt
        target:
          entity_id: cover.pergola_roof
    set_cover_position:
      - action: script.pergola_roof_set
        data:
          position: "{{ position }}"
