---
alias: Garden Soil Moisture Alert
description: >
  Advisory-only moisture alert. Notifies when any single bed reads
  dangerously dry (< 30%) or waterlogged (>= 85%). Purely informational —
  this automation NEVER opens a valve or vetoes a run. The probes proved
  unreliable (stuck-wet readings, silent Zigbee drops), which is why
  irrigation now runs on a fixed twice-weekly schedule with rain as the only
  veto; moisture is something a human looks at, not something a valve obeys.

  Each bed is evaluated SEPARATELY and named in the message — not a
  driest-wins aggregate — so one stuck probe can't mask a genuinely dry
  neighbour, and it's obvious which bed to go look at.

  Stale readings are excluded: a probe silent > 2h is reported by
  garden_soil_probe_silent_watchdog instead, and alerting on its frozen value
  would be noise. The two cutoffs are deliberately the same 2h — any gap
  between them is a band where a dying probe is reported by neither
  automation. Freshness is judged on the probe's newest channel (the
  moisture value itself can legitimately sit unchanged for hours).

  A latch (input_boolean.garden_soil_moisture_alerted) caps this at one alert
  per day; garden_soil_moisture_alert_reset clears it at midnight or on full
  recovery.
id: garden-soil-moisture-alert

mode: single

variables:
  DRY: 30
  WET: 85
  # Freshness cutoff — must exceed the ~20-30 min healthy report interval
  # with margin, and must NOT exceed the watchdog's own 2h silence cutoff.
  # It sat at 3h, which opened a 2-3h window where this alert had already
  # dropped the probe as stale while the watchdog had not yet called it
  # silent — a probe dying in that band was reported by neither. Matching
  # 7200 exactly hands the outage straight over: stale here == silent there.
  STALE_SECONDS: 7200
  soil_probes:
    pergola_left_flowerbed:
      - sensor.pergola_left_flowerbed_temperature
      - sensor.pergola_left_flowerbed_soil_moisture
      - sensor.pergola_left_flowerbed_illuminance_level
      - sensor.pergola_left_flowerbed_battery
    pergola_right_flowerbed:
      - sensor.pergola_right_flowerbed_temperature
      - sensor.pergola_right_flowerbed_soil_moisture
      - sensor.pergola_right_flowerbed_illuminance_level
      - sensor.pergola_right_flowerbed_battery
    sona_flowerbed:
      - sensor.sona_flowerbed_temperature
      - sensor.sona_flowerbed_soil_moisture
      - sensor.sona_flowerbed_illuminance_level
      - sensor.sona_flowerbed_battery
    vertical_garden:
      - sensor.vertical_garden_temperature
      - sensor.vertical_garden_soil_moisture
      - sensor.vertical_garden_illuminance_level
      - sensor.vertical_garden_battery
  # Per-bed verdicts, comma-joined. A top-level variable always renders to a
  # STRING, so building a list here would reach the condition as the literal
  # "['x']" — join up front and consumers stay simple.
  dry_beds: >
    {% set cutoff = (now() | as_timestamp) - (STALE_SECONDS | int) %}
    {% set ns = namespace(out=[]) %}
    {% for name, channels in soil_probes.items() %}
      {% set ages = expand(channels) | map(attribute='last_updated')
           | map('as_timestamp') | list %}
      {% set fresh = ages | length > 0 and (ages | max) >= cutoff %}
      {% set v = states('sensor.' ~ name ~ '_soil_moisture') %}
      {% if fresh and v not in ['unknown', 'unavailable', 'none', '']
            and (v | float(-1)) >= 0 and (v | float(-1)) < (DRY | float) %}
        {% set ns.out = ns.out + [name ~ ' ' ~ (v | float | round(0) | int) ~ '%'] %}
      {% endif %}
    {% endfor %}
    {{ ns.out | join(', ') }}
  wet_beds: >
    {% set cutoff = (now() | as_timestamp) - (STALE_SECONDS | int) %}
    {% set ns = namespace(out=[]) %}
    {% for name, channels in soil_probes.items() %}
      {% set ages = expand(channels) | map(attribute='last_updated')
           | map('as_timestamp') | list %}
      {% set fresh = ages | length > 0 and (ages | max) >= cutoff %}
      {% set v = states('sensor.' ~ name ~ '_soil_moisture') %}
      {% if fresh and v not in ['unknown', 'unavailable', 'none', '']
            and (v | float(-1)) >= (WET | float) %}
        {% set ns.out = ns.out + [name ~ ' ' ~ (v | float | round(0) | int) ~ '%'] %}
      {% endif %}
    {% endfor %}
    {{ ns.out | join(', ') }}

trigger:
  - platform: time_pattern
    minutes: "/30"

condition:
  - condition: state
    entity_id: input_boolean.garden_soil_moisture_alerted
    state: "off"
  - condition: template
    value_template: >
      {{ dry_beds | trim | length > 0 or wet_beds | trim | length > 0 }}

action:
  # Latch first so a failing notify step can't cause a 30-min re-fire loop.
  - action: input_boolean.turn_on
    target:
      entity_id: input_boolean.garden_soil_moisture_alerted
  - variables:
      # namespace() is required: a plain `set` inside an `if` block does not
      # escape the block scope in Jinja, so `parts` would always render empty.
      summary: >
        {% set ns = namespace(parts=[]) %}
        {% if dry_beds | trim | length > 0 %}
          {% set ns.parts = ns.parts + ['DRY (<' ~ DRY ~ '%): ' ~ dry_beds] %}
        {% endif %}
        {% if wet_beds | trim | length > 0 %}
          {% set ns.parts = ns.parts + ['WATERLOGGED (>=' ~ WET ~ '%): ' ~ wet_beds] %}
        {% endif %}
        {{ ns.parts | join(' — ') }}
  - action: persistent_notification.create
    data:
      notification_id: garden_soil_moisture_alert
      title: Garden soil moisture warning
      message: >
        {{ summary }}. Advisory only — irrigation still runs on its fixed
        twice-weekly schedule (Mon/Thu) and was not changed by this reading.
        Check the bed before acting; these probes are known to read
        stuck-wet.
  - action: notify.mobile_app_iglofon_new
    data:
      title: Garden soil moisture warning
      message: "{{ summary }}"
      data:
        tag: garden-soil-moisture
  - action: logbook.log
    data:
      name: Garden Soil Moisture Alert
      message: "{{ summary }}"
