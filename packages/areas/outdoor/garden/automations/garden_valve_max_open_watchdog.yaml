---
alias: Garden Valve Max Open Watchdog
description: >
  Restart-independent safety net: every 5 minutes, force-close any garden valve
  that has been open longer than a hard per-valve cap. The normal close path
  (garden_valve_auto_off) is a single in-memory delay per valve open — any HA
  restart, reload, or crash mid-run orphans the open valve with nothing left to
  close it. This sweep catches a stuck-open valve from ANY cause, not just
  restarts. Caps sit above each valve's longest legitimate single open:
  lawn zones 3300s (heat-boosted z1 35 min × am_ratio 1.4 = 49 min);
  vertical 3900s (garden_vertical_minutes slider max 60 min);
  drip 3600s (profile 45 min run). A single shared 1800s cap used to cut
  every 45-min drip run and hot-day deep lawn run short mid-water.
id: garden-valve-max-open-watchdog

mode: single

variables:
  # Hard cap on a single continuous valve open, in seconds, per valve.
  max_open_seconds:
    valve.lawn_sprinkler_zone_1: 3300
    valve.lawn_sprinkler_zone_2: 3300
    valve.lawn_sprinkler_zone_3: 3900
    valve.drip_irrigation: 3600

trigger:
  - platform: time_pattern
    minutes: "/5"

action:
  - repeat:
      for_each:
        - valve.lawn_sprinkler_zone_1
        - valve.lawn_sprinkler_zone_2
        - valve.lawn_sprinkler_zone_3
        - valve.drip_irrigation
      sequence:
        - if:
            - condition: template
              value_template: >
                {% set v = states[repeat.item] %}
                {{ is_state(repeat.item, 'open')
                   and (as_timestamp(now())
                        - as_timestamp(v.last_changed | default(now())))
                       > max_open_seconds[repeat.item] }}
          then:
            - action: valve.close_valve
              target:
                entity_id: "{{ repeat.item }}"
            - action: logbook.log
              data:
                name: Garden Valve Watchdog
                message: >
                  Force-closed {{ repeat.item }} — open longer than
                  {{ (max_open_seconds[repeat.item] / 60) | int }} min (likely
                  orphaned by a restart or crash).
                entity_id: "{{ repeat.item }}"
