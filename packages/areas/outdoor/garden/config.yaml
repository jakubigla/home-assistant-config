---
automation: !include_dir_list automations
template: !include_dir_list templates
script: !include_dir_merge_named scripts
light: !include_dir_list lights

input_select:
  garden_irrigation_mode:
    name: Garden Irrigation Mode
    options:
      - Manual
      - Eco
      - Standard
      - Intensive
      - Testing
      - Smart
      - Seasonal
    icon: mdi:sprinkler
  garden_oneoff_type:
    name: Garden One-off Type
    options:
      - Lawn
      - Drip
      - Vertical
      - Full
    icon: mdi:sprinkler-variant

input_datetime:
  garden_oneoff_at:
    name: Garden One-off Run At
    has_date: true
    has_time: true

input_number:
  garden_ondemand_minutes:
    name: Garden On-demand Minutes
    min: 1
    max: 25
    step: 1
    unit_of_measurement: min
    icon: mdi:timer-outline
  garden_lawn_minutes_standard:
    name: Garden Lawn Minutes (standard)
    min: 5
    max: 30
    step: 1
    unit_of_measurement: min
    icon: mdi:timer-outline
  garden_lawn_minutes_july:
    name: Garden Lawn Minutes (July)
    min: 5
    max: 30
    step: 1
    unit_of_measurement: min
    icon: mdi:timer-outline
  garden_drip_min_days_between:
    name: Garden Drip Min Days Between
    min: 1
    max: 7
    step: 1
    unit_of_measurement: d
    icon: mdi:calendar-clock
  # Vertical garden (valve.vertical_garden — repurposed after the lawn
  # shrank to two zones). Waters DAILY at 06:15 unless raining;
  # days_between is the rain-streak guarantee ceiling — a last run this
  # many days old fires even in rain (pockets get little rain). On
  # Scorcher days (forecast high >= 31 °C) the run uses minutes_hot
  # instead of minutes — sensor.garden_vertical_planned_minutes picks,
  # everything downstream reads that sensor. All knobs tunable from the
  # dashboard. NOTE: no initial — an initial: resets the helper to it on
  # every HA restart, wiping dashboard-set values (bit us 2026-08-09:
  # minutes 122 -> 90 overnight). Without it HA restores the last value.
  garden_vertical_minutes:
    name: Garden Vertical Minutes
    min: 5
    max: 150
    step: 1
    unit_of_measurement: min
    icon: mdi:timer-outline
  garden_vertical_minutes_hot:
    name: Garden Vertical Minutes (Hot Day)
    min: 5
    max: 150
    step: 1
    unit_of_measurement: min
    icon: mdi:timer-alert-outline
  garden_vertical_days_between:
    name: Garden Vertical Rain Guarantee Days
    min: 1
    max: 14
    step: 1
    unit_of_measurement: d
    icon: mdi:calendar-clock

input_boolean:
  garden_oneoff_armed:
    name: Garden One-off Armed
    icon: mdi:timer-sand
  garden_ondemand_active:
    name: Garden On-demand Active
    icon: mdi:water-pump
  garden_valve_offline_alerted:
    name: Garden Valve Offline Alerted
    icon: mdi:bell-alert
    # Latch: set when the offline watchdog alerts, cleared on valve recovery or
    # at midnight. Gates the watchdog so it nags at most once per day per episode.
  garden_soil_probe_silent_alerted:
    name: Garden Soil Probe Silent Alerted
    icon: mdi:bell-alert
    # Latch: set when the soil-probe silence watchdog alerts, cleared when a
    # silent probe reports again or at midnight. Gates the watchdog so it nags
    # at most once per day per episode.
  garden_soil_moisture_alerted:
    name: Garden Soil Moisture Alerted
    icon: mdi:bell-alert
    # Latch: set when the per-bed moisture alert fires, cleared at midnight or
    # once every bed is back inside the safe band. Caps the alert at one per
    # day per episode.
  garden_waterlogged_alert_enabled:
    name: Garden Waterlogged Alert Enabled
    icon: mdi:water-alert
    initial: false
    # OFF by default: the waterlogged (>=85%) half of the moisture alert is
    # advisory-only and the probes are known to read stuck-wet, so it was pure
    # noise. The dry (<30%) half still alerts. Flip this on to bring it back.

rest:
  - resource: !secret garden_rain_url
    scan_interval: 1800
    sensor:
      - name: Garden Rain Accumulation
        unique_id: garden_rain_accumulation_mm
        unit_of_measurement: mm
        value_template: >
          {% set t = value_json.hourly.time %}
          {% set p = value_json.hourly.precipitation %}
          {% set lo = (now() - timedelta(hours=24)).strftime('%Y-%m-%dT%H') %}
          {% set hi = (now() + timedelta(hours=12)).strftime('%Y-%m-%dT%H') %}
          {% set ns = namespace(total=0.0) %}
          {% for i in range(t | count) %}
            {% if t[i][:13] >= lo and t[i][:13] <= hi %}
              {% set ns.total = ns.total + (p[i] | float(0)) %}
            {% endif %}
          {% endfor %}
          {{ ns.total | round(2) }}
        json_attributes_path: "$.hourly"
        json_attributes:
          - time
