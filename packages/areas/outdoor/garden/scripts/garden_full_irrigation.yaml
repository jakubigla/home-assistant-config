---
garden_full_irrigation:
  alias: Garden Full Irrigation
  description: >
    Runs complete irrigation sequence: both lawn zones followed by
    drip irrigation. Each step waits for the previous to finish.
    The vertical garden (zone 3) is deliberately NOT included — it has
    its own weekly cadence (script.garden_vertical_irrigation).
  icon: mdi:watering-can
  mode: single
  sequence:
    - action: script.garden_lawn_irrigation
    - delay:
        seconds: 5
    - action: script.garden_drip_irrigation
