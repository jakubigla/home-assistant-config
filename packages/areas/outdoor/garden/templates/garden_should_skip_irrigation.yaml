---
# Garden Skip Sensors (split lawn vs drip)
#
# Lawn and drip share identical skip logic:
#   skip if not in season (May–Sep), raining now, or rain accumulation >= 3mm.
#
# Soil probes are deliberately NOT part of any skip decision. They read
# stuck-wet and drop off Zigbee silently, so letting them veto a run meant
# beds could go unwatered on a bad reading. Moisture is advisory only —
# see garden_soil_moisture_alert, which notifies per bed and touches no valve.
#
# Legacy alias `binary_sensor.garden_should_skip_irrigation` kept
# pointing at the same logic for dashboards/back-compat.
trigger:
  - platform: time_pattern
    minutes: "/30"
  - platform: homeassistant
    event: start
  - platform: state
    entity_id:
      - binary_sensor.raining
action:
  - action: weather.get_forecasts
    target:
      entity_id: weather.forecast_home
    data:
      type: hourly
    response_variable: forecast_response
  - action: weather.get_forecasts
    target:
      entity_id: weather.forecast_home
    data:
      type: daily
    response_variable: daily_response
sensor:
  - name: Garden Forecast Today
    unique_id: garden_forecast_today
    icon: mdi:weather-sunny-alert
    unit_of_measurement: "°C"
    # Today's daily forecast, surfaced as attributes for the schedule brain.
    # The brain is a plain template sensor and cannot call weather.get_forecasts,
    # so the call lives here (this file's trigger already fetches the hourly
    # forecast) and the brain reads these attributes. Fail-safe: missing data
    # yields high=0/uv=0 -> Mild tier + no evening downstream.
    # Forecast keys MUST be read with .get(): Met.no omits uv_index beyond
    # ~day 3, and `day.uv_index | float(0)` raises UndefinedError anyway —
    # HA's float filter catches ValueError/TypeError, NOT a missing dict key.
    state: >
      {% set f = (daily_response['weather.forecast_home'].forecast
         if daily_response is defined else []) %}
      {{ (f[0].get('temperature', 0) | float(0)) if f | count > 0 else 0 }}
    attributes:
      high: >
        {% set f = (daily_response['weather.forecast_home'].forecast
           if daily_response is defined else []) %}
        {{ (f[0].get('temperature', 0) | float(0)) if f | count > 0 else 0 }}
      uv: >
        {% set f = (daily_response['weather.forecast_home'].forecast
           if daily_response is defined else []) %}
        {{ (f[0].get('uv_index', 0) | float(0)) if f | count > 0 else 0 }}
      condition: >
        {% set f = (daily_response['weather.forecast_home'].forecast
           if daily_response is defined else []) %}
        {{ f[0].get('condition', 'unknown') if f | count > 0 else 'unknown' }}
      # Per-day daily forecast (high/uv/condition) for the next ~6 days, so the
      # schedule brain can size each future day's heat tier off ITS OWN day, not
      # today's. JSON (tojson) so the brain parses it back with from_json. Days
      # beyond the forecast horizon simply aren't in the list -> brain defaults
      # them to Mild/no-boost. uv missing on far days -> 0 (won't qualify sunny).
      forecast_7day: >
        {% set f = (daily_response['weather.forecast_home'].forecast
           if daily_response is defined else []) %}
        {% set ns = namespace(rows=[]) %}
        {% for day in f %}
          {% set ns.rows = ns.rows + [{
            'date': (day.get('datetime', '') | string)[:10],
            'high': day.get('temperature', 0) | float(0),
            'uv': day.get('uv_index', 0) | float(0),
            'condition': day.get('condition', 'unknown') | string
          }] %}
        {% endfor %}
        {{ ns.rows | tojson }}
binary_sensor:
  - name: Garden Lawn Should Skip
    unique_id: garden_lawn_should_skip
    icon: mdi:water-off
    state: >
      {% set is_raining = is_state('binary_sensor.raining', 'on') %}
      {% set month = now().month %}
      {% set in_season = month >= 5 and month <= 9 %}
      {% set rain_mm = states('sensor.garden_rain_accumulation') | float(0) %}
      {{ not in_season or is_raining or rain_mm >= 3 }}
    attributes:
      reason: >
        {% set month = now().month %}
        {% set in_season = month >= 5 and month <= 9 %}
        {% set rain_mm = states('sensor.garden_rain_accumulation') | float(0) %}
        {% if not in_season %} out_of_season
        {% elif is_state('binary_sensor.raining', 'on') %} raining_now
        {% elif rain_mm >= 3 %} rain_accumulation_3mm
        {% else %} none {% endif %}
  # Soil probes are NOT consulted here — they proved unreliable (stuck-wet
  # readings, silent Zigbee drops), so they no longer veto a scheduled run.
  # Moisture is advisory only, surfaced by garden_soil_moisture_alert.
  # Rain remains the sole wet-veto: raining now, or >=3mm accumulated.
  - name: Garden Drip Should Skip
    unique_id: garden_drip_should_skip
    icon: mdi:water-off
    state: >
      {% set is_raining = is_state('binary_sensor.raining', 'on') %}
      {% set month = now().month %}
      {% set in_season = month >= 5 and month <= 9 %}
      {% set rain_mm = states('sensor.garden_rain_accumulation') | float(0) %}
      {{ not in_season or is_raining or rain_mm >= 3 }}
    attributes:
      reason: >
        {% set month = now().month %}
        {% set in_season = month >= 5 and month <= 9 %}
        {% set rain_mm = states('sensor.garden_rain_accumulation') | float(0) %}
        {% if not in_season %} out_of_season
        {% elif is_state('binary_sensor.raining', 'on') %} raining_now
        {% elif rain_mm >= 3 %} rain_accumulation_3mm
        {% else %} none {% endif %}
  - name: Garden Should Skip Irrigation
    unique_id: garden_should_skip_irrigation
    icon: mdi:water-off
    state: >
      {% set is_raining = is_state('binary_sensor.raining', 'on') %}
      {% set month = now().month %}
      {% set in_season = month >= 5 and month <= 9 %}
      {% set rain_mm = states('sensor.garden_rain_accumulation') | float(0) %}
      {{ not in_season or is_raining or rain_mm >= 3 }}
    attributes:
      reason: >
        {% set month = now().month %}
        {% set in_season = month >= 5 and month <= 9 %}
        {% set rain_mm = states('sensor.garden_rain_accumulation') | float(0) %}
        {% if not in_season %} out_of_season
        {% elif is_state('binary_sensor.raining', 'on') %} raining_now
        {% elif rain_mm >= 3 %} rain_accumulation_3mm
        {% else %} none {% endif %}
