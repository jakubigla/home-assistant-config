---
alias: Ensuite occupancy state machine
description: >
  Latch input_boolean.ensuite_occupied. Entry: door open OR PIR (entrance)
  OR mmWave (shower). Exit on mmWave off for 5 s — door close and PIR do not
  clear occupancy (mmWave covers the whole room incl. shower). Watchdog clears
  a stuck latch after 20 min if mmWave is off/unavailable (HA restart, sensor
  drop missing the off-edge). A second watchdog clears it when mmWave is stuck
  ON: latch on with no PIR or door change for 2 h (polled every 10 min).
id: 1f3c8a90-6b21-4e44-9a7c-2d5e8f10c001

mode: restart
max_exceeded: silent

trigger:
  - platform: state
    entity_id: binary_sensor.ensuite_door
    from: "off"
    to: "on"
    id: entry
  - platform: state
    entity_id: binary_sensor.ensuite_bathroom_motion
    from: "off"
    to: "on"
    id: entry
  - platform: state
    entity_id: binary_sensor.ensuite_bathroom_presence
    from: "off"
    to: "on"
    id: entry
  - platform: state
    entity_id: binary_sensor.ensuite_bathroom_presence
    to: "off"
    for:
      seconds: 5
    id: exit
  # Watchdog: latch stuck on (HA restart / mmWave unavailable missed the
  # off-edge that would normally clear it). Edge-independent — fires on
  # duration. mode: restart resets the 20 min on every real re-entry.
  - platform: state
    entity_id: input_boolean.ensuite_occupied
    to: "on"
    for:
      minutes: 20
    id: watchdog
  # Stale-mmWave watchdog: the sensor itself can stick ON (2026-11-21: ON
  # 07:04 -> 06:59 next day, no off-edge, lights burning in an empty
  # bathroom and re-lit 15 s after the away automation switched them off).
  # The 20 min watchdog above only clears when mmWave is off/unavailable, so
  # a stuck-ON sensor needs its own cut-off. Polled, not a one-shot `for:` -
  # a one-shot check that finds recent PIR/door activity never fires again.
  - platform: time_pattern
    minutes: "/10"
    id: watchdog_stale

condition: []

action:
  - choose:
      - conditions:
          - condition: trigger
            id: entry
        sequence:
          - action: input_boolean.turn_on
            target:
              entity_id: input_boolean.ensuite_occupied
      - conditions:
          - condition: trigger
            id: exit
        sequence:
          - condition: state
            entity_id: binary_sensor.ensuite_bathroom_presence
            state: "off"
          - action: input_boolean.turn_off
            target:
              entity_id: input_boolean.ensuite_occupied
      # Stale-mmWave watchdog: latch on, but neither the PIR nor the door has
      # changed for 2 h -> nobody is really in there, whatever mmWave says.
      - conditions:
          - condition: trigger
            id: watchdog_stale
          - condition: state
            entity_id: input_boolean.ensuite_occupied
            state: "on"
          - condition: template
            value_template: >
              {% set motion = states.binary_sensor.ensuite_bathroom_motion %}
              {% set door = states.binary_sensor.ensuite_door %}
              {{ motion is not none and door is not none
                 and now() - motion.last_changed > timedelta(hours=2)
                 and now() - door.last_changed > timedelta(hours=2)
                 and now() - states.input_boolean.ensuite_occupied.last_changed
                     > timedelta(hours=2) }}
        sequence:
          - action: input_boolean.turn_off
            target:
              entity_id: input_boolean.ensuite_occupied
      # Stuck-latch watchdog: clear if mmWave is off OR unavailable.
      - conditions:
          - condition: trigger
            id: watchdog
          - condition: not
            conditions:
              - condition: state
                entity_id: binary_sensor.ensuite_bathroom_presence
                state: "on"
        sequence:
          - action: input_boolean.turn_off
            target:
              entity_id: input_boolean.ensuite_occupied
