---
alias: Bedroom Dim Sona Light When TV On
description: When the bedroom TV turns on while Sona's light is on, dim it to 1%
id: 651fed60-2e69-4fe2-ac2f-49018f94ce73

triggers:
  - trigger: state
    entity_id: media_player.bedroom_tv
    from: "off"
    not_to:
      - unavailable
      - unknown

conditions:
  - condition: state
    entity_id: light.bedroom_sona_bulbs
    state: "on"

actions:
  - action: light.turn_on
    target:
      entity_id: light.bedroom_sona_bulbs
    data:
      brightness_pct: 1
      transition: 1

mode: single
