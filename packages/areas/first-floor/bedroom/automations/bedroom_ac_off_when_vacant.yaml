---
alias: Bedroom AC off when vacant
description: >-
  Turn the bedroom AC off 5 min after the room goes empty, so it never runs
  for nobody. Keys off input_boolean.bedroom_occupied — the debounced latch
  that rides out mmWave still-gaps — NOT the raw binary_sensor.bedroom_occupancy,
  which drops during stillness.

  Deliberately inert during the cooldown period (21:00-23:00 OR
  binary_sensor.sleeping_time): the evening pre-cool exists precisely to chill
  an EMPTY room before bed, and overnight the mmWave sensor loses a sleeper so
  the latch eventually clears. Night is owned by bedroom_ac_cooldown_off
  (<=25C) and bedroom_ac_safety_timeout (3h, empty room only). The exempt
  window mirrors the union in bedroom_ac_cooldown_on so the two agree on what
  "cooldown period" means.

  Edge case: leaving at 20:50 lets this fire at 20:55, and cooldown-on re-arms
  the AC at 21:00 if the room is still hot — ~5 min of lost cooling. Accepted;
  widening the exempt window just moves the same boundary earlier.
id: e5a7c9db-5f6b-4ea0-c24d-6e8a0c2f4b55

mode: single
max_exceeded: silent

trigger:
  - trigger: state
    entity_id: input_boolean.bedroom_occupied
    to: "off"
    for:
      minutes: 5

condition:
  # Re-check the latch at run time — the for: trigger can fire off a stale
  # edge after a reload.
  - condition: state
    entity_id: input_boolean.bedroom_occupied
    state: "off"
  # Only act on an AC that is actually running.
  - condition: not
    conditions:
      - condition: state
        entity_id: climate.bedroom
        state:
          - "off"
          - "unavailable"
  # Stay out of the cooldown period entirely (evening pre-cool + sleep).
  - condition: not
    conditions:
      - condition: or
        conditions:
          - condition: time
            after: "21:00:00"
            before: "23:00:00"
          - condition: state
            entity_id: binary_sensor.sleeping_time
            state: "on"

action:
  - action: climate.turn_off
    target:
      entity_id: climate.bedroom
