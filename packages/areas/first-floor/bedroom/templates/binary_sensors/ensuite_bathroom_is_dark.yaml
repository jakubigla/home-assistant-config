---
binary_sensor:
  - name: ensuite_bathroom_is_dark
    device_class: light
    # Asymmetric: slow to claim dark (anti-flicker), fast to release when
    # the room brightens — so is_dark doesn't keep gating night-dim through
    # dawn after illuminance has already climbed.
    delay_on: "00:00:05"
    delay_off: "00:00:10"
    # Pure ensuite illuminance. The sensor was relocated so it no longer
    # picks up light.bedroom through the doorway, so the old bedroom-bleed
    # force-dark override is gone. This gates EVERY automatic turn-on, not
    # just the night-dim (night-dim vs main is chosen by sleeping_time in the
    # presence automation). Claim dark below 10 lx, hold until 15 lx. The old
    # <2 lx threshold read evening rooms (4-6 lx) as not-dark, so the lights
    # never auto-lit and had to be switched on by hand; daylit entries sit at
    # 11 lx and up and stay unlit.
    #
    # Fail NOT-dark, never dark. The multisensor drops off the Zigbee mesh
    # (battery / lost router) and goes unavailable for hours. `| float(0)`
    # used to coerce 'unavailable' to 0 lx, which reads as pitch-black, so
    # is_dark latched on and the presence automation lit the ensuite on every
    # entry in full daylight. Both source sensors must be explicitly checked
    # for a usable numeric state; when neither is, hold not-dark so the
    # lights-on gate stays shut rather than blazing at noon.
    #
    # Fallback order: the ensuite multisensor is primary (in-room, correctly
    # positioned). binary_sensor.ensuite_bathroom_motion's own lux is a
    # separate Aqara device on the same mesh — coarser and differently placed,
    # so it's a degraded-mode stand-in only, good enough to tell noon from
    # midnight.
    state: >
      {% set bad = ['unavailable', 'unknown', 'none', ''] %}
      {% set primary = states('sensor.ensuite_bathroom_illuminance') %}
      {% set backup = states('sensor.ensuite_bathroom_motion_illuminance') %}

      {% if primary | lower not in bad and primary | is_number %}
        {% set illuminance = primary | float %}
      {% elif backup | lower not in bad and backup | is_number %}
        {% set illuminance = backup | float %}
      {% else %}
        {% set illuminance = none %}
      {% endif %}

      {% set currently_dark =
        is_state('binary_sensor.ensuite_bathroom_is_dark', 'on') %}

      {% if illuminance is none %}
        {{ false }}
      {% elif currently_dark %}
        {{ illuminance < 15 }}
      {% else %}
        {{ illuminance < 10 }}
      {% endif %}
    attributes:
      # The lux actually used for the decision, not just the primary sensor's —
      # hardcoding the primary here reported "unavailable" while the fallback
      # was driving the state, which reads as a broken sensor during a normal
      # degraded-mode run.
      illuminance: >-
        {%- set bad = ['unavailable', 'unknown', 'none', ''] -%}
        {%- set primary = states('sensor.ensuite_bathroom_illuminance') -%}
        {%- set backup = states('sensor.ensuite_bathroom_motion_illuminance') -%}
        {{ primary if primary | lower not in bad and primary | is_number
           else (backup if backup | lower not in bad and backup | is_number
                 else 'unavailable') }}
      # Which sensor actually decided the state — "none" means both sources
      # were unusable and the sensor is failing not-dark on purpose.
      source: >-
        {%- set bad = ['unavailable', 'unknown', 'none', ''] -%}
        {%- set primary = states('sensor.ensuite_bathroom_illuminance') -%}
        {%- set backup = states('sensor.ensuite_bathroom_motion_illuminance') -%}
        {{ 'primary (' ~ primary ~ ' lx)'
           if primary | lower not in bad and primary | is_number
           else ('motion_fallback (' ~ backup ~ ' lx)'
                 if backup | lower not in bad and backup | is_number
                 else 'none (failing not-dark)') }}
      threshold_used: >
        {% if is_state('binary_sensor.ensuite_bathroom_is_dark', 'on') %}
          15 (hysteresis_off)
        {% else %}
          10 (hysteresis_on)
        {% endif %}
