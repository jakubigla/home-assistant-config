---
alias: Stairway presence
description: >-
  Turn on the stair lights when occupied; at night use the ground-floor
  standing lamp instead — the stairway light is onoff-only and too bright.
id: 80741f39-9e04-408b-90bf-dcde194198bb

mode: restart
max_exceeded: silent

trigger:
  - trigger: homeassistant
    event: start
  - trigger: event
    event_type: automation_reloaded
  - platform: state
    entity_id:
      - binary_sensor.stairway_presence
    from: "off"
    to: "on"
  - platform: state
    entity_id:
      - binary_sensor.stairway_presence
    from: "on"
    to: "off"
    for:
      hours: 0
      minutes: 0
      seconds: 30
conditions: []
action:
  - choose:
      # Night: light the ground-floor standing lamp instead of the stairway
      # light — light.stairway is onoff-only, so it cannot dim and is too
      # bright for sleepy eyes.
      - conditions:
          - condition: state
            entity_id: binary_sensor.stairway_presence
            state: "on"
          - condition: or
            conditions:
              - condition: state
                entity_id: binary_sensor.living_room_is_dark
                state: "on"
              - condition: state
                entity_id: binary_sensor.hall_is_dark
                state: "on"
          - condition: time
            after: "23:00:00"
            before: "07:00:00"
        sequence:
          # Only claim the lamp if it was off — never take over (and later
          # turn off) a lamp someone in the living room is already using.
          - if:
              - condition: state
                entity_id: light.living_room_light_standing_lamp
                state: "off"
            then:
              - alias: "Turn on the standing lamp as a night path light"
                service: light.turn_on
                target:
                  entity_id: light.living_room_light_standing_lamp
              - service: input_boolean.turn_on
                target:
                  entity_id: input_boolean.stairway_night_lamp

      # Daytime: someone is in the stairway
      - conditions:
          - condition: state
            entity_id: binary_sensor.stairway_presence
            state: "on"
          - condition: or
            conditions:
              - condition: state
                entity_id: binary_sensor.living_room_is_dark
                state: "on"
              - condition: state
                entity_id: binary_sensor.hall_is_dark
                state: "on"
        sequence:
          - alias: "Turn on the light"
            service: light.turn_on
            target:
              entity_id: light.stairway

      # If there's no one in the stairway
      - conditions:
          - condition: state
            entity_id: binary_sensor.stairway_presence
            state: "off"
        sequence:
          - alias: "Turn off the light"
            service: light.turn_off
            target:
              entity_id: light.stairway
          # Release the standing lamp only if this automation claimed it.
          - if:
              - condition: state
                entity_id: input_boolean.stairway_night_lamp
                state: "on"
            then:
              - service: light.turn_off
                target:
                  entity_id: light.living_room_light_standing_lamp
              - service: input_boolean.turn_off
                target:
                  entity_id: input_boolean.stairway_night_lamp
