---
attic_led_theme_apply:
  alias: Attic LEDs apply theme
  description: >
    Applies the room's selected LED theme (input_select.attic_<room>_led_theme)
    to its LEDs. The ONLY place palettes and room light maps live.
    To add a light to a room: add one line under that room in `rooms`.
    To add a theme: add a palette under `themes` + an option to all three
    input_selects in the attic _floor config.
    A slot is an rgb list, or a number = colour temperature in kelvin (used by
    the kitchen-only White theme). A light with `kelvin` ignores the theme.
    Fields: room (key under `rooms`), mode (full|ambient, default full),
    roles (subset of the room's role keys, default all), only_on (true = skip
    lights that are off, used when the theme changes).
    Lights fade in: a light that is off is first set to 1% in its colour, then
    ramped to its target over the room's `fade_seconds`; a light that is on
    ramps from where it is. Theme changes (only_on) switch colour instantly.
  mode: queued
  fields:
    room:
      description: office, gym or kitchen
      example: office
    mode:
      description: full or ambient (kitchen - full or boost), default full
      example: full
    roles:
      description: list of the room's role keys (default all)
      example: "[main, windows]"
    only_on:
      description: only touch lights that are already on
      example: false
  sequence:
    - variables:
        # Seconds the LEDs take to fade from off / their current level to
        # target, per room: office is brisk, gym is a slow, smooth build-up.
        fade_seconds:
          office: 1
          gym: 8
          kitchen: 1
        # Theme key = slugified input_select option. Three colour slots (rgb).
        themes:
          # Kitchen only: the colour-temperature preset, so White == the old
          # behaviour before the kitchen had themes.
          white:
            primary: "{{ states('input_number.attic_kitchen_leds_color_temp') | int(2700) }}"
            secondary: "{{ states('input_number.attic_kitchen_leds_color_temp') | int(2700) }}"
            accent: "{{ states('input_number.attic_kitchen_leds_color_temp') | int(2700) }}"
          miami_vice:
            primary: [0, 229, 208]
            secondary: [255, 50, 200]
            accent: [0, 229, 208]
          blaugrana:
            primary: [0, 80, 255]
            secondary: [190, 0, 30]
            accent: [0, 80, 255]
          lakers:
            primary: [110, 30, 220]
            secondary: [255, 185, 30]
            accent: [110, 30, 220]
          tron:
            primary: [0, 200, 255]
            secondary: [255, 90, 0]
            accent: [0, 200, 255]
          synthwave:
            primary: [140, 40, 255]
            secondary: [255, 40, 170]
            accent: [140, 40, 255]
          ocean:
            primary: [0, 200, 170]
            secondary: [0, 60, 255]
            accent: [0, 200, 170]
          fire_and_ice:
            primary: [90, 200, 255]
            secondary: [255, 40, 0]
            accent: [90, 200, 255]
          christmas:
            primary: [255, 0, 0]
            secondary: [0, 255, 40]
            accent: [255, 0, 0]
          aurora:
            primary: [0, 255, 110]
            secondary: [140, 40, 255]
            accent: [0, 255, 110]
          sunset:
            primary: [255, 100, 0]
            secondary: [255, 40, 120]
            accent: [255, 100, 0]
          halloween:
            primary: [255, 90, 0]
            secondary: [140, 0, 255]
            accent: [255, 90, 0]
        # room -> role -> light, colour slot, brightness % (full / ambient).
        rooms:
          office:
            main:
              {light: light.attic_office_leds, slot: primary, full: 61, ambient: 20}
            windows:
              {light: light.office_windows_leds, slot: secondary, full: 80, ambient: 10}
            furniture:
              {light: light.office_furniture_leds, slot: accent, full: 29, ambient: 4}
            desk:
              {light: light.office_office_desk, slot: secondary, full: 80, ambient: 4}
          gym:
            main:
              {light: light.attic_gym_leds, slot: primary, full: 61, ambient: 20}
            windows:
              {light: light.gym_windows_leds, slot: secondary, full: 80, ambient: 10}
            furniture:
              {light: light.gym_furniture_leds, slot: accent, full: 29, ambient: 4}
          # full = presence / single press, boost = LEDs double-press from off.
          # The kitchen LED strip is white-only (CCT): colour turns it dark, so
          # it ignores the theme (`kelvin` overrides `slot`). The three main
          # Hue bulbs carry the theme: primary / secondary / primary.
          kitchen:
            leds:
              light: light.attic_kitchen_leds
              kelvin: "{{ states('input_number.attic_kitchen_leds_color_temp') | int(2700) }}"
              full: "{{ states('input_number.attic_kitchen_leds_brightness') | int(50) }}"
              boost: 100
            bulb_left:
              {light: light.attic_kitchen_left, slot: primary, full: 100, boost: 100}
            bulb_middle:
              {light: light.attic_kitchen_middle, slot: secondary, full: 100, boost: 100}
            bulb_right:
              {light: light.attic_kitchen_right, slot: primary, full: 100, boost: 100}
        theme_key: >-
          {{ states('input_select.attic_' ~ room ~ '_led_theme') | slugify }}
        theme: >-
          {{ themes[theme_key]
             | default(themes.white if room == 'kitchen' else themes.miami_vice) }}
    - repeat:
        for_each: "{{ roles | default(rooms[room].keys() | list) }}"
        sequence:
          - variables:
              spec: "{{ rooms[room].get(repeat.item) }}"
          - condition: template
            value_template: >-
              {{ spec is not none
                 and (not (only_on | default(false))
                      or is_state(spec.light, 'on')) }}
          - variables:
              colour: >-
                {{ spec.kelvin | int if spec.kelvin is defined
                   else theme[spec.slot] }}
              colour_data: >-
                {{ {'color_temp_kelvin': colour | int} if colour is number
                   else {'rgb_color': colour} }}
          # Off -> start the fade from the bottom: instant 1% in the final
          # colour, so the ramp below is a pure brightness change.
          - if:
              - condition: template
                value_template: >-
                  {{ not (only_on | default(false))
                     and is_state(spec.light, 'off') }}
            then:
              - action: light.turn_on
                target:
                  entity_id: "{{ spec.light }}"
                data: "{{ dict(colour_data, brightness_pct=1) }}"
          - action: light.turn_on
            target:
              entity_id: "{{ spec.light }}"
            data: >-
              {{ dict(colour_data,
                      brightness_pct=spec[mode | default('full')] | int,
                      transition=0 if (only_on | default(false))
                                 else fade_seconds.get(room, 3)) }}
