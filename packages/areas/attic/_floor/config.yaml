---
automation: !include_dir_list automations
template: !include_dir_list templates
script: !include_dir_merge_named scripts

# Shared LED themes for rooms with the furniture / windows / main LED set
# (office, gym). Palettes live in ONE place: scripts/attic_led_theme_apply.yaml.
# Pick a theme per room from the phone dashboard (Attic view). No `initial:`
# so the choice survives restarts. Option names slugify to the theme keys
# in the script, so keep them in sync.
input_select:
  attic_office_led_theme:
    name: Office LED theme
    icon: mdi:palette
    options: &led_themes
      - Miami Vice
      - Blaugrana
      - Lakers
      - Tron
      - Synthwave
      - Ocean
  attic_gym_led_theme:
    name: Gym LED theme
    icon: mdi:palette
    options: *led_themes
