---
alias: Attic all off when vacant
description: >
  Safety net: once nobody has been anywhere in the attic (or on its stairs) for
  15 min, turn off every attic light and both ACs. Per-room presence
  automations normally clear lights much sooner; this catches manual
  switch-ons and the ACs. After a restart it waits the same 15 min before
  checking. Only ever turns things off.
id: 0b57fb71-2070-4ff6-a6c9-8d5d4ebefe02

mode: restart
max_exceeded: silent

triggers:
  - trigger: state
    entity_id: binary_sensor.attic_occupied
    to: "off"
    for:
      minutes: 15
    id: vacant
  - trigger: homeassistant
    event: start
    id: start

conditions:
  # Cleaning mode: cleaners are in; no automatic changes.
  - condition: state
    entity_id: input_boolean.cleaning_mode
    state: "off"
actions:
  - if:
      - condition: trigger
        id: start
    then:
      - delay:
          minutes: 15
  - condition: state
    entity_id: binary_sensor.attic_occupied
    state: "off"
    for:
      minutes: 15
  # Gym LED strips fade to 1% first so they don't come back on bright
  # (script.attic_leds_fade_off). Not awaited: the rest goes off meanwhile.
  - action: script.turn_on
    target:
      entity_id: script.attic_leds_fade_off
    data:
      variables:
        lights:
          - light.attic_gym_leds
          - light.gym_windows_leds
          - light.gym_furniture_leds
  - action: light.turn_off
    target:
      entity_id:
        - light.attic_gym
        - light.attic_office
        - light.attic_office_leds
        - light.office_windows_leds
        - light.office_furniture_leds
        - light.office_office_desk
        - light.attic_main
        - light.attic_stairs
        - light.attic_kitchen_leds
        - light.attic_snapback_leds
        - light.attic_bathroom_right
        - light.attic_bathroom_mirror
        - light.attic_bathroom_leds
  - action: switch.turn_off
    target:
      entity_id: switch.attic_jordan_logo
  # Only ACs actually running — the units beep on every command. The office
  # AC is left alone while its heat hold runs: that automation ends it after
  # 60 min empty, so a lunch break downstairs doesn't let the office go cold.
  - variables:
      running_acs: >
        {% set acs = ['climate.gym_ac'] %}
        {% if is_state('input_boolean.office_ac_preheat_active', 'off') %}
          {% set acs = acs + ['climate.office_ac'] %}
        {% endif %}
        {{ acs | reject('is_state', 'off') | reject('is_state', 'unavailable')
           | list }}
  - if:
      - condition: template
        value_template: "{{ running_acs | count > 0 }}"
    then:
      - action: climate.turn_off
        target:
          entity_id: "{{ running_acs }}"
