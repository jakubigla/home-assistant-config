---
automation: !include_dir_list automations
template: !include_dir_list templates

# LED preset — tweak from the UI, applies live if the LEDs are already on.
# No `initial:` so values survive restarts.
input_number:
  attic_gym_leds_brightness:
    name: Gym LEDs Brightness
    min: 1
    max: 100
    step: 1
    unit_of_measurement: "%"
    icon: mdi:brightness-6
  attic_gym_leds_color_temp:
    name: Gym LEDs Colour Temperature
    min: 2000
    max: 6500
    step: 100
    unit_of_measurement: K
    icon: mdi:thermometer
  # Dim window + furniture LEDs while someone is in the attic hall (gym empty).
  attic_gym_ambient_brightness:
    name: Gym Ambient LEDs Brightness
    min: 1
    max: 100
    step: 1
    unit_of_measurement: "%"
    icon: mdi:brightness-4
  attic_gym_ambient_color_temp:
    name: Gym Ambient LEDs Colour Temperature
    min: 2000
    max: 6500
    step: 100
    unit_of_measurement: K
    icon: mdi:thermometer
