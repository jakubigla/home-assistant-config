---
alias: Gym LEDs presence
description: >
  Presence in the gym (FP2) turns all gym LEDs on when dark, using the
  brightness/colour-temp preset from input_number.attic_gym_leds_*. Changing
  the preset re-applies it live. LEDs go off 30 s after presence clears.
  Start/reload only ever turns the LEDs off, never on.
id: 5f3a8de8-6880-4ccd-99a9-37c2bea39775

mode: restart
max_exceeded: silent

triggers:
  - trigger: homeassistant
    event: start
    id: sync
  - trigger: event
    event_type: automation_reloaded
    id: sync
  - trigger: state
    entity_id: binary_sensor.gym_presence
    from: "off"
    to: "on"
    id: occupied
  - trigger: state
    entity_id: binary_sensor.attic_gym_is_dark
    from: "off"
    to: "on"
    id: occupied
  - trigger: state
    entity_id: binary_sensor.gym_presence
    from: "on"
    to: "off"
    for:
      seconds: 30
    id: vacant
  - trigger: state
    entity_id:
      - input_number.attic_gym_leds_brightness
      - input_number.attic_gym_leds_color_temp
    id: preset

variables:
  leds:
    - light.attic_gym_leds
    - light.gym_windows_leds
    - light.gym_furniture_leds

actions:
  - choose:
      - conditions:
          - condition: trigger
            id: occupied
          - condition: state
            entity_id: binary_sensor.gym_presence
            state: "on"
          - condition: state
            entity_id: binary_sensor.attic_gym_is_dark
            state: "on"
        sequence:
          - action: light.turn_on
            target:
              entity_id: "{{ leds }}"
            data:
              brightness_pct: "{{ states('input_number.attic_gym_leds_brightness') | int(80) }}"
              color_temp_kelvin: "{{ states('input_number.attic_gym_leds_color_temp') | int(2700) }}"

      # Preset tweaked while lit -> re-apply live.
      - conditions:
          - condition: trigger
            id: preset
          - condition: template
            value_template: "{{ leds | select('is_state', 'on') | list | count > 0 }}"
        sequence:
          - action: light.turn_on
            target:
              entity_id: "{{ leds }}"
            data:
              brightness_pct: "{{ states('input_number.attic_gym_leds_brightness') | int(80) }}"
              color_temp_kelvin: "{{ states('input_number.attic_gym_leds_color_temp') | int(2700) }}"

      - conditions:
          - condition: trigger
            id:
              - vacant
              - sync
          - condition: state
            entity_id: binary_sensor.gym_presence
            state: "off"
        sequence:
          - action: light.turn_off
            target:
              entity_id: "{{ leds }}"
