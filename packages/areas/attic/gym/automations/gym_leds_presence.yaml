---
alias: Gym LEDs presence
description: >
  Resolves the gym LEDs from presence, when dark:
  Miami Vice palette: main + furniture LEDs turquoise, window LEDs pink.
  - gym occupied (FP2) -> full look (main 155/255, windows 204/255,
    furniture 75/255)
  - gym empty but attic hall occupied (FP300) -> same colours, dimmed
    ambient (main 20 %, windows 10 %, furniture 4 %)
  - both empty (gym 30 s, hall 1 min) -> all off
  Start/reload only ever turns the LEDs off, never on.
id: 5f3a8de8-6880-4ccd-99a9-37c2bea39775

mode: restart
max_exceeded: silent

triggers:
  - trigger: homeassistant
    event: start
    id: sync
  - trigger: event
    event_type: automation_reloaded
    id: sync
  - trigger: state
    entity_id: binary_sensor.gym_occupancy
    from: "off"
    to: "on"
    id: gym_on
  - trigger: state
    entity_id: binary_sensor.gym_occupancy
    from: "on"
    to: "off"
    for:
      seconds: 30
    id: gym_vacant
  - trigger: state
    entity_id: binary_sensor.attic_occupancy
    from: "off"
    to: "on"
    id: hall_on
  - trigger: state
    entity_id: binary_sensor.attic_occupancy
    from: "on"
    to: "off"
    for:
      minutes: 1
    id: hall_vacant
  - trigger: state
    entity_id: binary_sensor.attic_gym_is_dark
    from: "off"
    to: "on"
    id: dark

variables:
  leds_all:
    - light.attic_gym_leds
    - light.gym_windows_leds
    - light.gym_furniture_leds
  # Miami Vice palette (rgb).
  turquoise: [0, 229, 208]
  pink: [255, 50, 200]
  # full | ambient | off | hold (leave as is)
  gym_mode: >
    {% set dark = is_state('binary_sensor.attic_gym_is_dark', 'on') %}
    {% set gym = is_state('binary_sensor.gym_occupancy', 'on') %}
    {% set hall = is_state('binary_sensor.attic_occupancy', 'on') %}
    {% set t = trigger.id %}
    {% if gym %}
      {{ 'full' if dark and t in ['gym_on', 'dark'] else 'hold' }}
    {% elif hall %}
      {{ 'ambient' if dark and t in ['gym_vacant', 'hall_on', 'dark'] else 'hold' }}
    {% elif t in ['gym_vacant', 'hall_vacant', 'sync'] %}
      off
    {% else %}
      hold
    {% endif %}

conditions:
  # Cleaning mode: cleaners are in; no automatic changes.
  - condition: state
    entity_id: input_boolean.cleaning_mode
    state: "off"
actions:
  - choose:
      - conditions: "{{ gym_mode == 'full' }}"
        sequence:
          - action: light.turn_on
            target:
              entity_id: light.attic_gym_leds
            data:
              brightness: 155
              rgb_color: "{{ turquoise }}"
          - action: light.turn_on
            target:
              entity_id: light.gym_windows_leds
            data:
              brightness: 204
              rgb_color: "{{ pink }}"
          - action: light.turn_on
            target:
              entity_id: light.gym_furniture_leds
            data:
              brightness: 75
              rgb_color: "{{ turquoise }}"

      - conditions: "{{ gym_mode == 'ambient' }}"
        sequence:
          - action: light.turn_on
            target:
              entity_id: light.attic_gym_leds
            data:
              brightness_pct: 20
              rgb_color: "{{ turquoise }}"
          - action: light.turn_on
            target:
              entity_id: light.gym_windows_leds
            data:
              brightness_pct: 10
              rgb_color: "{{ pink }}"
          - action: light.turn_on
            target:
              entity_id: light.gym_furniture_leds
            data:
              brightness_pct: 4
              rgb_color: "{{ turquoise }}"

      - conditions: "{{ gym_mode == 'off' }}"
        sequence:
          - action: light.turn_off
            target:
              entity_id: "{{ leds_all }}"
