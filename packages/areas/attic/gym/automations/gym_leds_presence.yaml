---
alias: Gym LEDs presence
description: >
  Resolves the gym LEDs from presence, when dark:
  Colours come from the theme in input_select.attic_gym_led_theme (palettes
  and light map: script.attic_led_theme_apply).
  - gym occupied (FP2) -> full look
  - gym empty but attic hall occupied (FP300) -> same theme, dim ambient
  - both empty (gym 30 s, hall 1 min) -> all off
  Changing the theme re-applies it live to the lights that are on. Start/
  reload only ever turns the LEDs off, never on.
id: 5f3a8de8-6880-4ccd-99a9-37c2bea39775

mode: restart
max_exceeded: silent

triggers:
  - trigger: homeassistant
    event: start
    id: sync
  - trigger: event
    event_type: automation_reloaded
    id: sync
  - trigger: state
    entity_id: binary_sensor.gym_occupancy
    from: "off"
    to: "on"
    id: gym_on
  - trigger: state
    entity_id: binary_sensor.gym_occupancy
    from: "on"
    to: "off"
    for:
      seconds: 30
    id: gym_vacant
  - trigger: state
    entity_id: binary_sensor.attic_occupancy
    from: "off"
    to: "on"
    id: hall_on
  - trigger: state
    entity_id: binary_sensor.attic_occupancy
    from: "on"
    to: "off"
    for:
      minutes: 1
    id: hall_vacant
  - trigger: state
    entity_id: binary_sensor.attic_gym_is_dark
    from: "off"
    to: "on"
    id: dark
  - trigger: state
    entity_id: input_select.attic_gym_led_theme
    id: theme

variables:
  leds_all:
    - light.attic_gym_leds
    - light.gym_windows_leds
    - light.gym_furniture_leds
  # full | ambient | off | hold (leave as is)
  gym_mode: >
    {% set dark = is_state('binary_sensor.attic_gym_is_dark', 'on') %}
    {% set gym = is_state('binary_sensor.gym_occupancy', 'on') %}
    {% set hall = is_state('binary_sensor.attic_occupancy', 'on') %}
    {% set t = trigger.id %}
    {% if t == 'theme' %}
      {{ 'full' if gym else ('ambient' if hall else 'hold') }}
    {% elif gym %}
      {{ 'full' if dark and t in ['gym_on', 'dark'] else 'hold' }}
    {% elif hall %}
      {{ 'ambient' if dark and t in ['gym_vacant', 'hall_on', 'dark'] else 'hold' }}
    {% elif t in ['gym_vacant', 'hall_vacant', 'sync'] %}
      off
    {% else %}
      hold
    {% endif %}

conditions:
  # Cleaning mode: cleaners are in; no automatic changes.
  - condition: state
    entity_id: input_boolean.cleaning_mode
    state: "off"
actions:
  - choose:
      - conditions: "{{ gym_mode in ['full', 'ambient'] }}"
        sequence:
          - action: script.attic_led_theme_apply
            data:
              room: gym
              mode: "{{ gym_mode }}"
              only_on: "{{ trigger.id == 'theme' }}"

      - conditions: "{{ gym_mode == 'off' }}"
        sequence:
          - action: light.turn_off
            target:
              entity_id: "{{ leds_all }}"
