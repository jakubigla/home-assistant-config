---
binary_sensor:
  - name: attic_hall_is_dark
    device_class: light
    delay_on: "00:00:05"
    delay_off: "00:00:30"
    # Only gates turning lights ON. Once lit, light bleed pushes the lux up and
    # this flips off — harmless, nothing turns off on it.
    state: >
      {% set illuminance = states('sensor.attic_illuminance') | float(0) %}
      {% if is_state('binary_sensor.outdoor_is_dark', 'on') %}
        on
      {% elif is_state('binary_sensor.attic_hall_is_dark', 'on') %}
        {{ illuminance < 20 }}
      {% else %}
        {{ illuminance < 10 }}
      {% endif %}
    attributes:
      illuminance: "{{ states('sensor.attic_illuminance') }}"
