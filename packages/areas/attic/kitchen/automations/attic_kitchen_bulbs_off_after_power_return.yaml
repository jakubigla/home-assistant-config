---
alias: Attic Tapo bulbs off after power return
description: >
  The Tapo bulbs power up lit (HA has no power-on-state setting for them), so
  after a power cut on the attic circuit the relays come back on, the bulbs
  with them, and nothing would ever turn them off. When a bulb returns from
  unavailable, wait (max 3 min) for the attic presence sensors to rejoin, then
  switch the stairs and main bulbs off unless someone is in the attic.
  Only ever turns lights off.
id: 8b4e2a60-5f1d-4c79-9a3e-0d6c7b1f2e94

mode: single
max_exceeded: silent

triggers:
  - trigger: state
    entity_id:
      - light.attic_main_bulb_1
      - light.attic_main_bulb_2
      - light.attic_main_bulb_3
      - light.attic_stairs_bulb_left
      - light.attic_stairs_bulb_right
    from: unavailable
    to: "on"

conditions:
  # Cleaning mode: cleaners are in; no automatic changes.
  - condition: state
    entity_id: input_boolean.cleaning_mode
    state: "off"
actions:
  # attic_occupied reads "off" while its sensors are unavailable, so let them
  # rejoin first or a present person would look like an empty attic.
  - wait_template: >-
      {{ ['binary_sensor.gym_occupancy',
          'binary_sensor.office_occupancy',
          'binary_sensor.attic_occupancy',
          'binary_sensor.attic_stairs_presence',
          'binary_sensor.office_bathroom_attic_bathroom_occupancy']
         | reject('is_state', 'unavailable')
         | reject('is_state', 'unknown') | list | count == 5 }}
    timeout:
      minutes: 3
    continue_on_timeout: true
  - condition: state
    entity_id: binary_sensor.attic_occupied
    state: "off"
  - action: light.turn_off
    target:
      entity_id:
        - light.attic_main
        - light.attic_stairs
