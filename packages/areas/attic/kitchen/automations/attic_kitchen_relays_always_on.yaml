---
alias: Attic kitchen switch stays decoupled
description: >
  After a Z2M (re)start, re-asserts decoupled mode on both buttons of the
  attic_kitchen wall switch, so a click goes to HA (attic_kitchen_switch) and
  never straight to the relay.
  TEMPORARY (2026-11-10): this used to also force both relays back ON, because
  they are the mains feed of the attic Tapo bulbs. While those bulbs are on
  TPAP firmware HA can't control, the relays ARE the light switch
  (templates/lights/attic_main.yaml, attic_stairs.yaml), so that part is gone.
  Revert when TPAP works (git revert of the PR that made this change).
id: 3a9d5f17-8c2e-4b60-a1d4-7e0f6b3c9d25

mode: single
max_exceeded: silent

triggers:
  # HA starts ~30-60 s before Z2M after a power cut, so key off the bridge
  # coming online (plus a delay for devices to rejoin), not homeassistant.start.
  # The message is retained, so this also fires on every automation reload
  # (harmless: re-selecting decoupled is a no-op).
  - trigger: mqtt
    topic: zigbee2mqtt/bridge/state
    value_template: "{{ value_json.state | default(value) }}"
    payload: online

actions:
  - delay:
      minutes: 2
  - action: select.select_option
    target:
      entity_id:
        - select.attic_kitchen_operation_mode_left
        - select.attic_kitchen_operation_mode_right
    data:
      option: decoupled
