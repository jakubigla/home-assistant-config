---
alias: Attic kitchen LEDs presence
description: >
  Someone on the attic stairs (first-floor FP2 zone 4) or in the attic hall
  (FP300) turns the attic kitchen LEDs on when the attic hall is dark, in the
  theme from input_select.attic_kitchen_led_theme (White = the preset from
  input_number.attic_kitchen_leds_*; palettes: script.attic_led_theme_apply).
  Changing the theme or the preset re-applies it live to the LEDs and main
  bulbs if they are on. If it gets dark while
  someone is there, they come on then. Off once both the stairs and the attic
  hall have been clear for 2 min (the main and staircase Tapo bulbs go off at
  the same time, but are never turned on here — the wall switch does that). Start/reload only ever
  turns lights off, never on.
id: 4997d5b2-1f7d-4854-bf2f-c29bb2d5a09f

mode: restart
max_exceeded: silent

triggers:
  - trigger: homeassistant
    event: start
    id: sync
  - trigger: event
    event_type: automation_reloaded
    id: sync
  - trigger: state
    entity_id:
      - binary_sensor.attic_stairs_presence
      - binary_sensor.attic_occupancy
    from: "off"
    to: "on"
    id: occupied
  - trigger: state
    entity_id: binary_sensor.attic_hall_is_dark
    from: "off"
    to: "on"
    id: occupied
  - trigger: state
    entity_id:
      - binary_sensor.attic_stairs_presence
      - binary_sensor.attic_occupancy
    from: "on"
    to: "off"
    for:
      minutes: 2
    id: vacant
  - trigger: state
    entity_id:
      - input_number.attic_kitchen_leds_brightness
      - input_number.attic_kitchen_leds_color_temp
      - input_select.attic_kitchen_led_theme
    id: preset

conditions:
  # Cleaning mode: cleaners are in; no automatic changes.
  - condition: state
    entity_id: input_boolean.cleaning_mode
    state: "off"
actions:
  - choose:
      - conditions:
          - condition: trigger
            id: occupied
          - condition: or
            conditions:
              - condition: state
                entity_id: binary_sensor.attic_stairs_presence
                state: "on"
              - condition: state
                entity_id: binary_sensor.attic_occupancy
                state: "on"
          - condition: state
            entity_id: binary_sensor.attic_hall_is_dark
            state: "on"
        sequence:
          - action: script.attic_led_theme_apply
            data:
              room: kitchen
              roles: [leds]

      # Theme / preset changed -> re-apply live to whatever is on.
      - conditions:
          - condition: trigger
            id: preset
        sequence:
          - action: script.attic_led_theme_apply
            data:
              room: kitchen
              only_on: true

      - conditions:
          - condition: trigger
            id:
              - vacant
              - sync
          - condition: state
            entity_id: binary_sensor.attic_stairs_presence
            state: "off"
          - condition: state
            entity_id: binary_sensor.attic_occupancy
            state: "off"
        sequence:
          - action: light.turn_off
            target:
              entity_id:
                - light.attic_kitchen_leds
                - light.attic_main
                - light.attic_stairs
