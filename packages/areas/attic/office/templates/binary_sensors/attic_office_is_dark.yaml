---
binary_sensor:
  - name: attic_office_is_dark
    device_class: light
    # Dark when the room's own FP300 reads < 5 lux. Once dark, it stays dark
    # while the room's own lights are on, because their light pushes lux back
    # over the threshold (otherwise it would read "light" and block mode
    # changes). Falls back to sun-based outdoor_is_dark if the lux sensor is
    # unavailable.
    state: >
      {% set lux = states('sensor.office_lluminance') %}
      {% set lit = ['light.office_office_desk', 'light.attic_office_leds', 'light.office_windows_leds', 'light.office_furniture_leds'] | select('is_state', 'on') | list | count > 0 %}
      {% if not is_number(lux) %}
        {{ is_state('binary_sensor.outdoor_is_dark', 'on') }}
      {% else %}
        {{ lux | float < 5 or (this.state == 'on' and lit) }}
      {% endif %}
    attributes:
      illuminance: "{{ states('sensor.office_lluminance') }}"
