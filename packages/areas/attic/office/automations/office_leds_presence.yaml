---
alias: Office LEDs presence
description: >
  Office occupancy (FP300) turns the office ceiling, window and furniture
  LEDs on when dark, in the theme selected in
  input_select.attic_office_led_theme (palettes and light map:
  script.attic_led_theme_apply). Changing the theme re-applies it live to
  whatever is on (incl. the desk lamp). LEDs go off 30 s after
  presence clears. Start/reload only ever turns the LEDs off, never on.
id: e7166f10-8f11-484f-a817-8f552becd97d

mode: restart
max_exceeded: silent

triggers:
  - trigger: homeassistant
    event: start
    id: sync
  - trigger: event
    event_type: automation_reloaded
    id: sync
  - trigger: state
    entity_id: binary_sensor.office_occupancy
    from: "off"
    to: "on"
    id: occupied
  - trigger: state
    entity_id: binary_sensor.attic_office_is_dark
    from: "off"
    to: "on"
    id: occupied
  - trigger: state
    entity_id: binary_sensor.office_occupancy
    from: "on"
    to: "off"
    for:
      seconds: 30
    id: vacant
  - trigger: state
    entity_id: input_select.attic_office_led_theme
    id: theme

variables:
  # Everything switched off when the office empties (the desk lamp has its
  # own automation).
  leds_off:
    - light.attic_office_leds
    - light.office_windows_leds
    - light.office_furniture_leds

conditions:
  # Cleaning mode: cleaners are in; no automatic changes.
  - condition: state
    entity_id: input_boolean.cleaning_mode
    state: "off"
actions:
  - choose:
      - conditions:
          - condition: trigger
            id: occupied
          - condition: state
            entity_id: binary_sensor.office_occupancy
            state: "on"
          - condition: state
            entity_id: binary_sensor.attic_office_is_dark
            state: "on"
        sequence:
          - action: script.attic_led_theme_apply
            data:
              room: office
              roles: [main, windows, furniture]

      # Theme changed -> re-apply live to every office light that is on.
      - conditions:
          - condition: trigger
            id: theme
        sequence:
          - action: script.attic_led_theme_apply
            data:
              room: office
              only_on: true

      - conditions:
          - condition: trigger
            id:
              - vacant
              - sync
          - condition: state
            entity_id: binary_sensor.office_occupancy
            state: "off"
        sequence:
          - action: light.turn_off
            target:
              entity_id: "{{ leds_off }}"
