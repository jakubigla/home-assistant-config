---
alias: Office LEDs presence
description: >
  Office occupancy (FP300) turns the office ceiling + window LEDs on
  when dark (furniture LEDs are manual-only) in a Miami Vice palette:
  ceiling LEDs turquoise, window LEDs pink (the desk lamp, pink, is set by
  its own automation; furniture LEDs keep their manual turquoise). LEDs go
  off 30 s after presence clears. Start/reload only ever turns the LEDs off, never on.
id: e7166f10-8f11-484f-a817-8f552becd97d

mode: restart
max_exceeded: silent

triggers:
  - trigger: homeassistant
    event: start
    id: sync
  - trigger: event
    event_type: automation_reloaded
    id: sync
  - trigger: state
    entity_id: binary_sensor.office_occupancy
    from: "off"
    to: "on"
    id: occupied
  - trigger: state
    entity_id: binary_sensor.attic_office_is_dark
    from: "off"
    to: "on"
    id: occupied
  - trigger: state
    entity_id: binary_sensor.office_occupancy
    from: "on"
    to: "off"
    for:
      seconds: 30
    id: vacant

variables:
  # Auto-on set. office_furniture_leds deliberately left out (manual only) but
  # still turned off when the office empties.
  # Miami Vice palette (rgb) and raw brightness (0-255) per light.
  turquoise: [0, 229, 208]
  pink: [255, 50, 200]
  leds_off:
    - light.attic_office_leds
    - light.office_windows_leds
    - light.office_furniture_leds

conditions:
  # Cleaning mode: cleaners are in; no automatic changes.
  - condition: state
    entity_id: input_boolean.cleaning_mode
    state: "off"
actions:
  - choose:
      - conditions:
          - condition: trigger
            id: occupied
          - condition: state
            entity_id: binary_sensor.office_occupancy
            state: "on"
          - condition: state
            entity_id: binary_sensor.attic_office_is_dark
            state: "on"
        sequence:
          - action: light.turn_on
            target:
              entity_id: light.attic_office_leds
            data:
              rgb_color: "{{ turquoise }}"
              brightness: 155
          - action: light.turn_on
            target:
              entity_id: light.office_windows_leds
            data:
              rgb_color: "{{ pink }}"
              brightness: 204

      - conditions:
          - condition: trigger
            id:
              - vacant
              - sync
          - condition: state
            entity_id: binary_sensor.office_occupancy
            state: "off"
        sequence:
          - action: light.turn_off
            target:
              entity_id: "{{ leds_off }}"
