---
alias: Office desk light presence
description: >
  Office occupancy (FP300) turns the desk lamp on when dark in the
  selected office LED theme. Off 10 s after occupancy clears — unless
  you're still around in the attic kitchen/hall or the office toilet; then
  10 s after those clear too.
  Start/reload only ever turns the lamp off, never on.
id: e47e363f-06f7-48d5-8744-89e8f79a2d6a

mode: restart
max_exceeded: silent

triggers:
  - trigger: homeassistant
    event: start
    id: sync
  - trigger: event
    event_type: automation_reloaded
    id: sync
  - trigger: state
    entity_id: binary_sensor.office_occupancy
    from: "off"
    to: "on"
    id: occupied
  - trigger: state
    entity_id: binary_sensor.attic_office_is_dark
    from: "off"
    to: "on"
    id: occupied
  - trigger: state
    entity_id: binary_sensor.office_occupancy
    from: "on"
    to: "off"
    for:
      seconds: 10
    id: vacant
  # Popped out to the attic kitchen / toilet and then left from there.
  - trigger: state
    entity_id:
      - binary_sensor.attic_occupancy
      - binary_sensor.office_bathroom_attic_bathroom_occupancy
    from: "on"
    to: "off"
    for:
      seconds: 10
    id: vacant

variables:
  # Still around: a trip to the attic kitchen/hall or the office toilet
  # keeps the office lit; it goes off once those clear too.
  nearby:
    - binary_sensor.attic_occupancy
    - binary_sensor.office_bathroom_attic_bathroom_occupancy

conditions:
  # Cleaning mode: cleaners are in; no automatic changes.
  - condition: state
    entity_id: input_boolean.cleaning_mode
    state: "off"
actions:
  - choose:
      - conditions:
          - condition: trigger
            id: occupied
          - condition: state
            entity_id: binary_sensor.office_occupancy
            state: "on"
          - condition: state
            entity_id: binary_sensor.attic_office_is_dark
            state: "on"
        sequence:
          - action: script.attic_led_theme_apply
            data:
              room: office
              roles: [desk]

      - conditions:
          - condition: trigger
            id:
              - vacant
              - sync
          - condition: state
            entity_id: binary_sensor.office_occupancy
            state: "off"
          - "{{ nearby | select('is_state', 'on') | list | count == 0 }}"
        sequence:
          - action: light.turn_off
            target:
              entity_id: light.office_office_desk
