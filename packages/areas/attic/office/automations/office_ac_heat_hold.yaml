---
alias: Office AC heat hold
description: >
  Keeps the office at 23 °C (office hygrometer) with the AC while it is in
  use. Stop-gap until the radiators are fixed. The AC's own sensor sits high
  on the wall and reads ~5-8 °C above the room, so HA is the thermostat: AC
  at max (31 °C) to heat, at its min (16 °C) to idle, with hysteresis.
  Starts: workdays at 06:15 (pre-heat: the office cools to ~20.5 °C overnight
  and the AC adds ~1.4 °C/h; 06:45 only reached 23 °C after 09:00), or any time
  someone enters a cold office (below target - hysteresis). Only when it is
  heating season (outdoor < 15 °C), the AC is off and cleaning mode is off.
  Ends - AC off - once the office has been empty 60 min (keeps it warm over
  a lunch break), or 20 min outside workday hours (07:45-18:00), or at 10:00
  if nobody came in after the pre-heat. No pre-heat when the house has been
  empty for 30 min (slept elsewhere, holiday, left early for a day out), and
  a running hold ends once everyone has been away 30 min. The 30 min grace
  rides out the brief overnight presence blips (phones dozing) seen on the
  house presence sensor. Starts are verified: the AC once accepted a heat
  command and stayed off (tuya_local, 2026-11-19), so a start waits 90 s for
  heat and retries once, and regulate re-sends heat while the hold is on but
  the AC is not heating. Switching the AC off or changing its
  setpoint by hand hands control back and pauses auto-start until the office
  has been empty 60 min (or the next morning).
  Switching the AC ON by hand (HomeKit) while its setpoint is still one of
  HA's (31 / 16) is "I want it warm", not an override: HA adopts it as a hold
  (2026-11-20: a HomeKit re-on ran at the stale 31 °C all day, office hit
  25.9 °C). Picking any other setpoint is the deliberate override - HA leaves
  it alone, but turns the AC off and notifies once the office reaches
  max_room (24 °C), and when the office / house has been empty long enough.
id: 6f0b7d1e-3c55-4a8e-9d21-0f4e8a7b2c19
# Disabled 2026-11-25: the office now has real heaters (climate.office_heater).
# Off while gathering heater data, so the AC neither pre-heats nor auto-starts
# on arrival. Kept (not deleted) in case the heaters need an AC assist later.
# initial_state: false keeps it off across restarts and reloads.
initial_state: false

mode: queued
max_exceeded: silent

variables:
  # Room temperature (office hygrometer) to hold.
  target: 23
  # Heat resumes below target - hysteresis; idles at/above target.
  hysteresis: 0.5
  # AC setpoints used as "heat" / "idle" - its own sensor reads far above
  # the room, so these are the only values that reliably mean on / off.
  heat_setpoint: 31
  idle_setpoint: 16
  # Hard cap for a manual override: above this the AC is switched off.
  max_room: 24
  # Above this outdoor temperature it is not heating season.
  max_outdoor: 15
  room: "{{ states('sensor.office_hygro_temperature') }}"
  outdoor: "{{ states('sensor.bosh_junkers_outdoor_temp_sensor') }}"
  in_work_hours: >
    {{ is_state('binary_sensor.workday_sensor', 'on')
       and today_at('07:45') <= now() < today_at('18:00') }}
  # Everyone away for at least away_minutes. Unknown / unavailable counts
  # as home, so a sensor glitch never cancels a pre-heat.
  away_minutes: 30
  house_empty: >
    {{ is_state('binary_sensor.presence_someone_at_home', 'off')
       and now() - states.binary_sensor.presence_someone_at_home.last_changed
           >= timedelta(minutes=away_minutes) }}

triggers:
  - trigger: time
    at: "06:15:00"
    id: preheat
  - trigger: state
    entity_id: binary_sensor.office_occupancy
    to: "on"
    id: arrive
  - trigger: state
    entity_id: sensor.office_hygro_temperature
    id: regulate
  - trigger: state
    entity_id: binary_sensor.office_occupancy
    to: "off"
    for:
      minutes: 20
    id: vacant_short
  - trigger: state
    entity_id: binary_sensor.office_occupancy
    to: "off"
    for:
      minutes: 60
    id: vacant_long
  - trigger: time
    at: "10:00:00"
    id: deadline
  - trigger: state
    entity_id: binary_sensor.presence_someone_at_home
    to: "off"
    for:
      minutes: 30
    id: house_empty
  # Hand-back: AC switched off, or setpoint changed to something HA never sets.
  - trigger: state
    entity_id: climate.office_ac
    to: "off"
    id: manual
  - trigger: state
    entity_id: climate.office_ac
    attribute: temperature
    id: setpoint
  # AC switched on to heat (by hand, or by this automation's own start -
  # the adopt branch skips that one because the hold is already active).
  - trigger: state
    entity_id: climate.office_ac
    from: "off"
    to: heat
    id: manual_on

actions:
  # A new day or a long absence clears a manual pause.
  - if:
      - condition: trigger
        id:
          - preheat
          - vacant_long
    then:
      - action: input_boolean.turn_off
        target:
          entity_id: input_boolean.office_ac_heat_paused

  - choose:
      # --- Adopt: AC switched on by hand at HA's own setpoint -> hold ---
      - conditions:
          - condition: trigger
            id: manual_on
          - condition: state
            entity_id: input_boolean.office_ac_preheat_active
            state: "off"
          - condition: template
            value_template: >
              {{ state_attr('climate.office_ac', 'temperature') | float(0)
                 in [heat_setpoint | float, idle_setpoint | float] }}
          - condition: template
            value_template: "{{ is_number(room) }}"
        sequence:
          - action: input_boolean.turn_off
            target:
              entity_id: input_boolean.office_ac_heat_paused
          - action: input_boolean.turn_on
            target:
              entity_id: input_boolean.office_ac_preheat_active
          - action: climate.set_temperature
            target:
              entity_id: climate.office_ac
            data:
              temperature: >
                {{ heat_setpoint if room | float < target else idle_setpoint }}

      # --- Cap: manual override heating a room already at max_room ---
      - conditions:
          - condition: trigger
            id:
              - regulate
              - manual_on
          - condition: state
            entity_id: input_boolean.office_ac_preheat_active
            state: "off"
          - condition: state
            entity_id: climate.office_ac
            state: heat
          - condition: template
            value_template: >
              {{ is_number(room) and room | float >= max_room
                 and state_attr('climate.office_ac', 'temperature') | float(0)
                     != idle_setpoint | float }}
        sequence:
          - action: climate.turn_off
            target:
              entity_id: climate.office_ac
          - action: notify.mobile_app_iglofon_new
            data:
              title: Office AC switched off
              message: >
                Office reached {{ room }} °C (cap {{ max_room }} °C) with the
                AC heating at {{ state_attr('climate.office_ac', 'temperature') }} °C.
                Turn it back on if you really meant it.

      # --- Override ends: office / house empty, AC still heating by hand ---
      - conditions:
          - condition: trigger
            id:
              - vacant_long
              - house_empty
          - condition: state
            entity_id: input_boolean.office_ac_preheat_active
            state: "off"
          - condition: state
            entity_id: climate.office_ac
            state: heat
          - condition: state
            entity_id: binary_sensor.office_occupancy
            state: "off"
        sequence:
          - action: climate.turn_off
            target:
              entity_id: climate.office_ac

      # --- Start: workday pre-heat, or arrival in a cold office ---
      - conditions:
          - condition: or
            conditions:
              - condition: and
                conditions:
                  - condition: trigger
                    id: preheat
                  - condition: state
                    entity_id: binary_sensor.workday_sensor
                    state: "on"
                  - condition: template
                    value_template: "{{ is_number(room) and room | float < target }}"
                  - condition: template
                    value_template: "{{ not house_empty }}"
              - condition: and
                conditions:
                  - condition: trigger
                    id: arrive
                  - condition: state
                    entity_id: input_boolean.office_ac_heat_paused
                    state: "off"
                  - condition: template
                    value_template: >
                      {{ is_number(room) and room | float < target - hysteresis }}
          - condition: state
            entity_id: input_boolean.office_ac_preheat_active
            state: "off"
          - condition: state
            entity_id: climate.office_ac
            state: "off"
          - condition: state
            entity_id: input_boolean.cleaning_mode
            state: "off"
          - condition: template
            value_template: "{{ not is_number(outdoor) or outdoor | float < max_outdoor }}"
        sequence:
          - action: input_boolean.turn_on
            target:
              entity_id: input_boolean.office_ac_preheat_active
          - action: climate.set_hvac_mode
            target:
              entity_id: climate.office_ac
            data:
              hvac_mode: heat
          - delay:
              seconds: 3
          - action: climate.set_temperature
            target:
              entity_id: climate.office_ac
            data:
              temperature: "{{ heat_setpoint }}"
          # Verify: tuya_local has accepted a heat command and left the AC
          # off (2026-11-19). Wait for heat, retry once via turn_on.
          - wait_template: "{{ is_state('climate.office_ac', 'heat') }}"
            timeout:
              seconds: 90
            continue_on_timeout: true
          - if:
              - condition: template
                value_template: "{{ not is_state('climate.office_ac', 'heat') }}"
            then:
              - action: climate.turn_on
                target:
                  entity_id: climate.office_ac
              - delay:
                  seconds: 3
              - action: climate.set_hvac_mode
                target:
                  entity_id: climate.office_ac
                data:
                  hvac_mode: heat
              - delay:
                  seconds: 3
              - action: climate.set_temperature
                target:
                  entity_id: climate.office_ac
                data:
                  temperature: "{{ heat_setpoint }}"

      # --- Hold the room at target (hysteresis) ---
      - conditions:
          - condition: trigger
            id: regulate
          - condition: state
            entity_id: input_boolean.office_ac_preheat_active
            state: "on"
          - condition: template
            value_template: "{{ is_number(room) }}"
        sequence:
          - variables:
              current_sp: "{{ state_attr('climate.office_ac', 'temperature') | float(0) }}"
              wanted_sp: >
                {% if room | float >= target %}{{ idle_setpoint }}
                {% elif room | float < target - hysteresis %}{{ heat_setpoint }}
                {% else %}{{ current_sp }}{% endif %}
          # Also re-send while the hold is on but the AC is not heating -
          # otherwise a start the AC silently ignored is never retried.
          - condition: template
            value_template: >
              {{ wanted_sp | float != current_sp
                 or not is_state('climate.office_ac', 'heat') }}
          # tuya_local drops hvac_mode inside set_temperature, so a unit
          # that is off has to be switched on with its own call first.
          - if:
              - condition: template
                value_template: "{{ not is_state('climate.office_ac', 'heat') }}"
            then:
              - action: climate.set_hvac_mode
                target:
                  entity_id: climate.office_ac
                data:
                  hvac_mode: heat
              - delay:
                  seconds: 3
          - action: climate.set_temperature
            target:
              entity_id: climate.office_ac
            data:
              temperature: "{{ wanted_sp | float }}"

      # --- Manual takeover: hand control back, pause auto-start ---
      - conditions:
          - condition: or
            conditions:
              - condition: trigger
                id: manual
              - condition: and
                conditions:
                  - condition: trigger
                    id: setpoint
                  - condition: template
                    value_template: >
                      {{ trigger.to_state.attributes.temperature | float(0)
                         not in [heat_setpoint | float, idle_setpoint | float] }}
          - condition: state
            entity_id: input_boolean.office_ac_preheat_active
            state: "on"
        sequence:
          - action: input_boolean.turn_off
            target:
              entity_id: input_boolean.office_ac_preheat_active
          - action: input_boolean.turn_on
            target:
              entity_id: input_boolean.office_ac_heat_paused

      # --- End: office empty long enough, or nobody came in ---
      - conditions:
          - condition: state
            entity_id: input_boolean.office_ac_preheat_active
            state: "on"
          - condition: state
            entity_id: binary_sensor.office_occupancy
            state: "off"
          - condition: or
            conditions:
              - condition: trigger
                id:
                  - vacant_long
                  - house_empty
              # Short absences end it only outside workday hours; before
              # 07:45 the office is empty by design during the pre-heat.
              - condition: and
                conditions:
                  - condition: trigger
                    id: vacant_short
                  - condition: template
                    value_template: >
                      {{ not in_work_hours and now() >= today_at('07:45') }}
              # Pre-heated but nobody has been in since it started.
              - condition: and
                conditions:
                  - condition: trigger
                    id: deadline
                  - condition: template
                    value_template: >
                      {{ states.binary_sensor.office_occupancy.last_changed
                         < today_at('06:15') }}
        sequence:
          - action: input_boolean.turn_off
            target:
              entity_id: input_boolean.office_ac_preheat_active
          - action: climate.turn_off
            target:
              entity_id: climate.office_ac
