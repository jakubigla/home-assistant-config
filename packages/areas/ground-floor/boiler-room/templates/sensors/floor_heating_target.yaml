---
# Floor-heating (hc2) setpoint HA wants right now. The goal of the morning
# boost is hot WATER in the screed (warm feet in the bathroom), not room air:
# the floor needs ~1 h for hot water + ~1 h for the surface, so the boost
# starts an hour before the 07:00 bathroom window.
#   night    23:00 -> boost start   19 (same as the Bosch eco)
#   boost    06:00-08:30 workdays, 07:00-09:30 otherwise   23.5
#            (weekend end was 10:30: the ground floor gained ~2 °C and kept
#            it most of the day, 2026-11-21/22)
#   day      boost end -> 16:00     22.5 while Sona is home, 21 once she has
#                                   been out 30 min (ground floor is empty)
#   evening  16:00-23:00            22.5 (evenings together in the living room;
#                                   was 23, lowered 2026-11-24)
# Whole-house away is handled by the away preset, not here.
sensor:
  - name: floor_heating_target
    unique_id: floor_heating_target
    device_class: temperature
    unit_of_measurement: "°C"
    state_class: measurement
    state: >
      {% set wd = is_state('binary_sensor.workday_sensor', 'on') %}
      {% set boost_start = today_at('06:00') if wd else today_at('07:00') %}
      {% set boost_end = today_at('08:30') if wd else today_at('09:30') %}
      {% set s = states.person.sona %}
      {% set sona_in = s is none or s.state == 'home'
                       or now() - s.last_changed < timedelta(minutes=30) %}
      {% if now() < boost_start or now() >= today_at('23:00') %}19
      {% elif now() < boost_end %}23.5
      {% elif now() < today_at('16:00') %}{{ 22.5 if sona_in else 21 }}
      {% else %}22.5{% endif %}
    attributes:
      slot: >
        {% set wd = is_state('binary_sensor.workday_sensor', 'on') %}
        {% set boost_start = today_at('06:00') if wd else today_at('07:00') %}
        {% set boost_end = today_at('08:30') if wd else today_at('09:30') %}
        {% set s = states.person.sona %}
        {% set sona_in = s is none or s.state == 'home'
                         or now() - s.last_changed < timedelta(minutes=30) %}
        {% if now() < boost_start or now() >= today_at('23:00') %}night
        {% elif now() < boost_end %}boost
        {% elif now() < today_at('16:00') %}{{ 'day' if sona_in else 'day_empty' }}
        {% else %}evening{% endif %}
