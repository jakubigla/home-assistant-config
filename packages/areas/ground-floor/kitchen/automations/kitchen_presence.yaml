---
alias: Kitchen presence
description: Turn on the kitchen led lights when kitchen occupied
id: 2441c759-3b60-497b-99d0-4bd1d6f1ef28

mode: restart
max_exceeded: silent

trigger:
  # Sync on restart/reload: turn-off only, never turn-on (see action below)
  - trigger: homeassistant
    event: start
    id: sync
  - trigger: event
    event_type: automation_reloaded
    id: sync
  # Both sensors fire the light instantly — no on-edge debounce.
  # dashboard_presence (tablet proximity, near the entry) is the EARLY WARNING:
  # it typically leads kitchen_presence by 1-2s and sometimes by 25-60s, so it
  # lights the room before you walk in. Its pulses are short by nature (median
  # 2s, 52/59 under 5s) and a short pulse does NOT mean a false trigger, so a
  # `for:` here would swallow the signal rather than filter noise.
  # The cost of a false trigger is a brief light when someone walks past; the
  # 15s off-debounce below cleans that up on its own.
  - platform: state
    entity_id:
      - binary_sensor.kitchen_presence
      - binary_sensor.dashboard_presence
    from: "off"
    to: "on"
  - platform: state
    entity_id:
      - binary_sensor.kitchen_presence
      - binary_sensor.dashboard_presence
    from: "on"
    to: "off"
    for:
      hours: 0
      minutes: 0
      seconds: 15
conditions: []
action:
  - choose:
      # If someone is in the kitchen.
      # Not on sync: a restart/reload must never turn lights ON by itself,
      # only re-derive the off state.
      - conditions:
          - condition: not
            conditions:
              - condition: trigger
                id: sync
          - condition: or
            conditions:
              - condition: state
                entity_id: binary_sensor.kitchen_presence
                state: "on"
              - condition: state
                entity_id: binary_sensor.dashboard_presence
                state: "on"
          - condition: state
            entity_id: binary_sensor.kitchen_is_dark
            state: "on"
        sequence:
          - alias: "Turn on the light"
            service: light.turn_on
            target:
              entity_id: light.kitchen_led

      # If there's no one in the kitchen
      - conditions:
          - condition: state
            entity_id: binary_sensor.kitchen_presence
            state: "off"
          - condition: state
            entity_id: binary_sensor.dashboard_presence
            state: "off"
        sequence:
          - alias: "Turn off the light"
            service: light.turn_off
            target:
              entity_id: light.kitchen_led
