---
alias: Kitchen presence
description: Turn on the kitchen led lights when kitchen occupied
id: 2441c759-3b60-497b-99d0-4bd1d6f1ef28

mode: restart
max_exceeded: silent

trigger:
  # Sync on restart/reload: turn-off only, never turn-on (see action below)
  - trigger: homeassistant
    event: start
    id: sync
  - trigger: event
    event_type: automation_reloaded
    id: sync
  # dashboard_presence is a short-range tablet proximity sensor and blips
  # on/off within 1-2s; debounce the on-edge so blips don't relight the LED
  - platform: state
    entity_id:
      - binary_sensor.kitchen_presence
      - binary_sensor.dashboard_presence
    from: "off"
    to: "on"
    for:
      hours: 0
      minutes: 0
      seconds: 3
  - platform: state
    entity_id:
      - binary_sensor.kitchen_presence
      - binary_sensor.dashboard_presence
    from: "on"
    to: "off"
    for:
      hours: 0
      minutes: 0
      seconds: 15
conditions: []
action:
  - choose:
      # If someone is in the kitchen.
      # Not on sync: a restart/reload must never turn lights ON by itself,
      # only re-derive the off state.
      - conditions:
          - condition: not
            conditions:
              - condition: trigger
                id: sync
          - condition: or
            conditions:
              - condition: state
                entity_id: binary_sensor.kitchen_presence
                state: "on"
              - condition: state
                entity_id: binary_sensor.dashboard_presence
                state: "on"
          - condition: state
            entity_id: binary_sensor.kitchen_is_dark
            state: "on"
        sequence:
          - alias: "Turn on the light"
            service: light.turn_on
            target:
              entity_id: light.kitchen_led

      # If there's no one in the kitchen
      - conditions:
          - condition: state
            entity_id: binary_sensor.kitchen_presence
            state: "off"
          - condition: state
            entity_id: binary_sensor.dashboard_presence
            state: "off"
        sequence:
          - alias: "Turn off the light"
            service: light.turn_off
            target:
              entity_id: light.kitchen_led
