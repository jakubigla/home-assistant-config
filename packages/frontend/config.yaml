---
frontend:
  themes: !include_dir_merge_named ../themes
  # card-mod as a frontend module, not (only) a lovelace resource. HA does not
  # await lovelace resources before rendering views, so on the slow wall tablet
  # a fresh page load (Fully screensaver -> /wall-tablet/clock) rendered cards
  # before card-mod arrived and every card_mod block was silently ignored.
  # extra_module_url is imported from index.html before the app boots, so it
  # always wins the race. Restart required when this list changes. Bump the
  # ?v= cache-buster when HACS updates card-mod.
  extra_module_url:
    - /hacsfiles/lovelace-card-mod/card-mod.js?v=4.2.1

# Ticking clock source for the tablet screensaver view. Mushroom template
# cards only re-render when an entity they reference changes state, so a
# `now()`-only template renders once and then freezes. sensor.time updates
# every minute and gives the clock card something to react to.
sensor:
  - platform: time_date
    display_options:
      - time
      - date

template: !include_dir_list templates
