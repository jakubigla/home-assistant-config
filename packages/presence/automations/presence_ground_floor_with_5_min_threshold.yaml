---
alias: Presence - ground floor absent for 5 min
description: Presence in the ground floors with 5 min threshold on no presence
id: 173458d4-d369-40ba-b239-7299293d1e31

mode: restart
max_exceeded: silent

variables:
  # Entities in the light.* domain on this floor that must never be swept:
  #   - the *_display / ledbox entities are device indicator LEDs, not lights.
  #   - light.stairway is a shared 2-gang module at the stairs; its presence
  #     sensor spans both floors and stairway_presence owns it. Killing it from
  #     a ground-floor sweep can darken the stairs under someone descending.
  excluded_lights:
    - light.living_room_himidifier_display
    - light.connectivity_kit_ledbox
    - light.ap_ground_floor_led
    - light.stairway
  lights_to_kill: >
    {% set ns = namespace(items=[]) %}
    {% for entity in floor_entities('ground_floor')
       if entity.startswith('light.')
       and entity not in excluded_lights
       and states(entity) == 'on' %}
      {% set ns.items = ns.items + [entity] %}
    {% endfor %}
    {{ ns.items }}

trigger:
  - event: start
    trigger: homeassistant
  - event_type: automation_reloaded
    trigger: event
  - platform: state
    entity_id:
      - binary_sensor.ground_floor_presence
    from: "off"
    to: "on"
  - platform: state
    entity_id:
      - binary_sensor.ground_floor_presence
    from: "on"
    to: "off"
    for:
      hours: 0
      minutes: 5
      seconds: 0

action:
  - choose:
      # If someone is in ground floor
      - conditions:
          - condition: state
            entity_id: binary_sensor.ground_floor_presence
            state: "on"
        sequence:
          # Ambient lights: ON when dark
          - if:
              - condition: state
                entity_id: binary_sensor.living_room_is_dark
                state: "on"
            then:
              - alias: "Turn on standing lamp"
                service: light.turn_on
                target:
                  entity_id: light.living_room_light_standing_lamp
              - alias: "Turn on kitchen LEDs"
                service: light.turn_on
                target:
                  entity_id: light.kitchen_led
              - alias: "Turn on living room LEDs"
                service: light.turn_on
                data:
                  rgb_color:
                    - 255
                    - 169
                    - 144
                  brightness: 128
                target:
                  entity_id: light.living_room_leds

      # If there's no one in ground floor
      - conditions:
          - condition: state
            entity_id: binary_sensor.ground_floor_presence
            state: "off"
        sequence:
          - alias: "Turn off all ground floor lights"
            service: light.turn_off
            target:
              entity_id: "{{ lights_to_kill }}"
