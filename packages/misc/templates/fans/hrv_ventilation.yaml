---
# HRV as a plain 3-speed fan, for HomeKit and dashboards. The integration's own
# fan.hrv is NOT usable for this: it writes a different register, reads 20 %
# while the unit runs gear 2, and cannot hand control back to the schedule
# (see the compit-hrv-control knowledge leaf). This wrapper drives
# climate.hrv's fan_mode instead:
#
#   speed 33 / 66 / 100 %  -> low / medium / high (manual gear 1 / 2 / 3)
#   preset "auto"          -> the unit's own clock zones
#   turn on                -> auto
#   turn off               -> gear 1, NOT gear 0. A "turn everything off" scene
#                             or a stray Siri command must never stop the
#                             house ventilation, so off means "minimum".
#
# The unit is cloud-polled: the tile catches up ~80 s after a change. The
# arbiter (misc_hrv_ventilation_mode) still re-asserts its mode on its next
# trigger, so a manual speed is a temporary override.
fan:
  - name: HRV ventilation
    unique_id: hrv_ventilation
    icon: mdi:air-filter
    availability: "{{ has_value('climate.hrv') }}"
    state: "{{ states('sensor.hrv_ventilation_gear') | int(0) > 0 }}"
    speed_count: 3
    percentage: >-
      {{ ((states('sensor.hrv_ventilation_gear') | int(0)) * 100 / 3)
         | round(0) | int }}
    preset_modes:
      - auto
    preset_mode: >-
      {{ 'auto' if is_state_attr('climate.hrv', 'fan_mode', 'auto') else none }}
    turn_on:
      - action: climate.set_fan_mode
        target:
          entity_id: climate.hrv
        data:
          fan_mode: auto
    turn_off:
      - action: climate.set_fan_mode
        target:
          entity_id: climate.hrv
        data:
          fan_mode: low
    set_percentage:
      - action: climate.set_fan_mode
        target:
          entity_id: climate.hrv
        data:
          fan_mode: >-
            {{ 'low' if percentage <= 33
               else 'medium' if percentage <= 66 else 'high' }}
    set_preset_mode:
      - action: climate.set_fan_mode
        target:
          entity_id: climate.hrv
        data:
          fan_mode: auto
