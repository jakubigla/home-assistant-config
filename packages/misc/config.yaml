---
# Misc Package - Cross-Area Automations
# This package contains automations that control entities across multiple areas
# and don't belong to any specific area package.

automation: !include_dir_list automations
script: !include_dir_named scripts
template: !include_dir_list templates

# Supla cloud — ZAMEL ROW-02 relays (legacy YAML-only integration)
supla:
  servers:
    - server: !secret supla_host
      access_token: !secret supla_token
