---
alias: "Trip reminder: cancel food delivery"
description: >-
  Each morning, ask the AI task to scan the next 7 days of calendars for an
  upcoming trip away from home overnight. Work out which delivery days
  (Mon-Fri) fall inside the trip — a trip that only starts late in the day
  still needs that day's delivery — and remind to cancel them while the
  cancellation deadline (3 days before the first cancelled delivery) can
  still be met. Never nags after the deadline has passed.
id: 9f2c7a41-6b3e-4d58-9c10-trip-food-reminder

mode: single
max_exceeded: silent

trigger:
  - platform: time
    at: "09:00:00"

variables:
  # Calendars that can carry a real trip. Deliberately excludes sports
  # fixtures, public holidays and birthday calendars — pure noise that
  # costs tokens and invites false positives.
  trip_calendars:
    - calendar.jakub_igla_gmail_com
    - calendar.miu
    - calendar.home
    - calendar.prywatny
  # Delivery only runs Mon-Fri, so a Fri-evening or weekend-only trip
  # needs no cancellation.
  delivery_weekdays: [1, 2, 3, 4, 5]
  # Leaving at or after this hour still leaves breakfast, 2nd breakfast and
  # lunch to eat (or pack), so that day's delivery stays.
  late_start_hour: 15
  # A delivery must be cancelled this many days before it would arrive.
  notice_days: 3
  # Start reminding this many days before the deadline day, so an LLM miss
  # on one morning still has another chance. 0 = deadline day only.
  heads_up_days: 2

action:
  - alias: "Collect the next 7 days of events"
    action: calendar.get_events
    target:
      entity_id: "{{ trip_calendars }}"
    data:
      start_date_time: "{{ today_at('00:00') }}"
      duration:
        days: 7
    response_variable: calendar_events

  - alias: "Flatten the per-calendar response into one event list"
    variables:
      events: >-
        {% set ns = namespace(items=[]) %}
        {% for cal, payload in calendar_events.items() %}
          {% for e in payload.events %}
            {% set ns.items = ns.items + [{
                 'calendar': cal,
                 'start': e.start,
                 'end': e.end,
                 'summary': e.summary,
                 'description': (e.description | default(''))[:200]
               }] %}
          {% endfor %}
        {% endfor %}
        {{ ns.items | to_json }}

  - alias: "Ask the AI task whether a trip is coming up"
    action: ai_task.generate_data
    data:
      entity_id: ai_task.claude_ai_task
      task_name: trip-detection
      instructions: >-
        You are checking whether the user will be AWAY FROM HOME OVERNIGHT
        (travel, trip, holiday, business trip, staying elsewhere) in the
        coming days.

        Today is {{ now().strftime('%Y-%m-%d (%A)') }} (Europe/Warsaw).

        Calendar events for the next 7 days:
        {{ events }}

        Decide if any event indicates the user is away from home overnight.

        COUNT AS AWAY: flights, trips, holidays/vacation, business travel,
        hotel stays, weekends away, visits to another city or country,
        anything implying sleeping somewhere other than home.

        DO NOT COUNT AS AWAY: meetings, calls, workouts or exercise blocks
        (e.g. "Walking Pad"), routine daily blocks, appointments, birthdays,
        name days, public holidays, sports fixtures, reminders, deliveries,
        work tasks, or any event that is merely during the day and ends the
        same day at home.

        Be conservative. If you are not clearly confident the user is
        sleeping away from home, answer away=false. A false alarm is worse
        than a miss.

        IMPORTANT about all-day events: calendars store all-day events with
        an EXCLUSIVE end date, meaning the end value is the day AFTER the
        last day of the event. When an event is all-day (dates without
        times), subtract one day from its end value to get the true last day
        away. For events with explicit times, use the actual end date as-is.

        The time of day the trip starts matters: copy the event's start time
        exactly when it has one. Do not guess a time for all-day events.
      structure:
        away:
          selector:
            boolean:
          description: >-
            true only if clearly away from home overnight
          required: true
        start_date:
          selector:
            text:
          description: >-
            YYYY-MM-DD first day away, empty string if away is false
        start_time:
          selector:
            text:
          description: >-
            HH:MM 24-hour local time the trip starts on start_date, copied
            from the event. Empty string if the event is all-day, has no
            time, or away is false
        end_date:
          selector:
            text:
          description: >-
            YYYY-MM-DD LAST day away (the final night sleeping away from
            home, not the day after). For all-day events subtract one day
            from the exclusive end. Empty string if away is false
        summary:
          selector:
            text:
          description: >-
            short name of the trip, empty string if away is false
        reason:
          selector:
            text:
          description: one sentence explaining the decision
          required: true
    response_variable: trip

  - alias: "Work out which delivery days fall inside the trip"
    variables:
      # ISO dates (today onwards) of Mon-Fri deliveries that would arrive
      # while away. Empty list = nothing to cancel.
      cancel_days: >-
        {% set t = trip.data %}
        {% set ns = namespace(days=[]) %}
        {% if t.away and t.start_date and t.end_date %}
          {# Parse first and null-check BEFORE as_local: as_datetime returns
             None on an unparseable string, and as_local raises on None. The
             dates come back from the LLM as free text, so a non-ISO value
             ("next Friday") must fail closed rather than throw. #}
          {% set start_raw = t.start_date | as_datetime %}
          {% set end_raw = t.end_date | as_datetime %}
          {% if start_raw is not none and end_raw is not none %}
            {# as_datetime yields a naive datetime; today_at is tz-aware.
               as_local attaches the local zone so the arithmetic works. #}
            {% set start = start_raw | as_local %}
            {% set end = end_raw | as_local %}
            {% set today = today_at('00:00') %}
            {# Leaving late in the day: that day's food still gets eaten. #}
            {% set st = t.start_time | default('', true) | string | trim %}
            {% set late = st is match('^\d{1,2}:\d{2}$')
                          and (st.split(':')[0] | int) >= late_start_hour %}
            {% set first = start + timedelta(days=1) if late else start %}
            {# range() is empty when end < first, so no extra guard. #}
            {% for i in range(0, (end - first).days + 1) %}
              {% set day = first + timedelta(days=i) %}
              {% if day.isoweekday() in delivery_weekdays and day >= today %}
                {% set ns.days = ns.days + [day.date().isoformat()] %}
              {% endif %}
            {% endfor %}
          {% endif %}
        {% endif %}
        {{ ns.days }}
      # Last day on which the first affected delivery can still be cancelled.
      deadline: >-
        {% if cancel_days %}
          {{ ((cancel_days[0] | as_datetime | as_local)
              - timedelta(days=notice_days)).date().isoformat() }}
        {% else %}
          {{ none }}
        {% endif %}
      # Days from today to the deadline: 0 = today is the last chance,
      # negative = already too late (stay silent, the reminder is useless).
      days_left: >-
        {% if deadline is not none %}
          {{ ((deadline | as_datetime | as_local) - today_at('00:00')).days }}
        {% else %}
          {{ none }}
        {% endif %}

  - alias: "Stop unless a delivery needs cancelling and it is not too late"
    condition: template
    value_template: >-
      {{ cancel_days | count > 0
         and days_left is not none
         and days_left >= 0
         and days_left <= heads_up_days }}

  - alias: "Remind to cancel the delivery"
    action: notify.mobile_app_iglofon_new
    data:
      title: >-
        {{ 'Cancel food delivery — last day' if days_left == 0
           else 'Cancel food delivery' }}
      message: >-
        {% set t = trip.data %}
        {% set fmt = '%a %-d %b' %}
        {% set first = cancel_days[0] | as_datetime | as_local %}
        {% set last = cancel_days[-1] | as_datetime | as_local %}
        {% set st = t.start_time | default('', true) | string | trim %}
        {{ t.summary | default('Trip', true) }}
        ({{ t.start_date }}{{ ' ' ~ st if st }} to {{ t.end_date }}).
        Cancel {{ cancel_days | count }} deliver
        {{- 'y' if cancel_days | count == 1 else 'ies' }}:
        {{ first.strftime(fmt) }}
        {%- if cancel_days | count > 1 %} to {{ last.strftime(fmt) }}{% endif %}.
        {%- set dep = t.start_date | as_datetime | as_local %}
        {%- if first.date() != dep.date() and dep.isoweekday() in delivery_weekdays %}
        Departure is after {{ late_start_hour }}:00, so
        {{ dep.strftime('%A') }}'s food stays.
        {%- endif %}
        {{ 'Today is the last day to cancel.' if days_left == 0
           else 'Deadline ' ~ (deadline | as_datetime | as_local).strftime(fmt)
                ~ ' (' ~ days_left ~ ' day' ~ ('' if days_left == 1 else 's')
                ~ ' left).' }}
