---
sensor:
  - name: energy_tracked_month_kwh
    unique_id: energy_tracked_month_kwh
    unit_of_measurement: kWh
    device_class: energy
    state_class: total
    icon: mdi:lightning-bolt
    # The source utility meters reset on the 1st, so this sum drops to ~0 each
    # month. Without last_reset, state_class total records that drop as
    # negative consumption (Oct -3.8 kWh, Nov -9.1 kWh at the 1st in the
    # 12-month bar chart). last_reset = start of current month = new cycle.
    attributes:
      last_reset: >
        {{ now().replace(day=1, hour=0, minute=0, second=0, microsecond=0)
           .isoformat() }}
    state: >
      {% set sources = [
        'sensor.ensuite_bathroom_energy_this_month',
        'sensor.kitchen_leds_energy_this_month',
        'sensor.standing_lamp_energy_this_month',
        'sensor.porch_energy_this_month',
        'sensor.bathroom_energy_this_month',
        'sensor.kitchen_island_energy_this_month',
        'sensor.boiler_room_energy_this_month',
        'sensor.laundry_energy_this_month',
        'sensor.bedroom_reflectors_energy_this_month',
        'sensor.bedroom_sona_energy_this_month',
        'sensor.washer_energy_this_month',
        'sensor.tumble_dryer_energy_this_month'
      ] %}
      {{ sources | map('states') | map('float', 0) | sum | round(2) }}

  - name: energy_tracked_month_cost
    unique_id: energy_tracked_month_cost
    unit_of_measurement: PLN
    device_class: monetary
    icon: mdi:cash
    state: >
      {% set kwh = states('sensor.energy_tracked_month_kwh') | float(0) %}
      {% set rate = states('input_number.energy_tariff_rate') | float(1) %}
      {{ (kwh * rate) | round(2) }}

  - name: energy_tracked_month_projected_kwh
    unique_id: energy_tracked_month_projected_kwh
    unit_of_measurement: kWh
    device_class: energy
    state_class: total
    icon: mdi:trending-up
    state: >
      {% set kwh = states('sensor.energy_tracked_month_kwh') | float(0) %}
      {% set day = now().day %}
      {% set next_month = (now().replace(day=28) + timedelta(days=4)).replace(day=1) %}
      {% set days_in_month = (next_month - timedelta(days=1)).day %}
      {# Real none, not the text "unknown": a numeric sensor rejects that
         string ("Received invalid sensor state") — logged at 00:00 on the 1st. #}
      {% if day < 1 or kwh == 0 %}
        {{ none }}
      {% else %}
        {{ (kwh / day * days_in_month) | round(2) }}
      {% endif %}

  - name: energy_tracked_month_projected_cost
    unique_id: energy_tracked_month_projected_cost
    unit_of_measurement: PLN
    device_class: monetary
    icon: mdi:cash-fast
    state: >
      {% set pk = states('sensor.energy_tracked_month_projected_kwh') %}
      {% if pk in ('unknown', 'unavailable', 'none') %}
        {{ none }}
      {% else %}
        {% set rate = states('input_number.energy_tariff_rate') | float(1) %}
        {{ (pk | float(0) * rate) | round(2) }}
      {% endif %}
